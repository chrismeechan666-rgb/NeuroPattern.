<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NeuroPattern</title>
<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --bg:#f3f7f7;--card:#fff;--ink:#173f44;--muted:#6d8387;--line:#dce7e8;
  --teal:#176b68;--teal2:#dcefeb;--red:#a84444;--amber:#a66b14;--green:#2c7a56;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
.top{background:var(--card);padding:17px 18px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:27px;font-weight:900;letter-spacing:-.6px}.tag{font-size:12px;color:var(--muted);margin-top:2px}
.activeBadge{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--teal2);color:var(--teal);font-weight:800;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:9}
.tabs button{border:0;background:var(--card);padding:12px 13px;color:var(--muted);white-space:nowrap;font-weight:700}
.tabs button.on{color:var(--teal);border-bottom:3px solid var(--teal)}
.page{padding:17px 17px 92px}.h1{font-size:24px;font-weight:900;margin:0 0 6px}.h2{font-size:16px;font-weight:850;margin:18px 0 7px}
.p{font-size:14px;line-height:1.48;color:#4f666a}.muted{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:11px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.notice{background:#eef5f5}.danger{border-left:4px solid var(--red)}.warn{border-left:4px solid var(--amber)}.good{border-left:4px solid var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:13px}.big{font-size:23px;font-weight:900}.small{font-size:11px;color:var(--muted)}
.btn{width:100%;padding:13px 14px;border-radius:13px;border:0;font-weight:850;margin-top:9px;font-size:14px}
.primary{background:var(--teal);color:white}.secondary{background:white;color:var(--teal);border:1px solid #c9dada}.dangerBtn{background:#fff;color:var(--red);border:1px solid #e4caca}
.quickState{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.quickState button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:11px;color:var(--ink);font-weight:750}
.quickState button b{display:block;font-size:19px;margin-bottom:2px}.quickState button[data-level="4"]{border-color:#e2bcbc}
.field{margin-top:13px}.label{font-size:13px;font-weight:850;margin-bottom:7px}
.inp,select,textarea{width:100%;padding:11px;border:1px solid #d4e0e1;border-radius:11px;background:#fff;color:var(--ink);font:inherit}
textarea{min-height:78px;resize:vertical}.row{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 10px;border-radius:999px;border:1px solid #cbdadb;background:#fff;color:#50666a;font-size:12px}
.chip.on{background:var(--teal2);border-color:var(--teal);color:#155b58;font-weight:850}
.event{position:relative;padding-left:16px}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal);border-radius:4px}
.event.red:before{background:var(--red)}.event.amber:before{background:var(--amber)}
.eventHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eventTitle{font-weight:850}
.profile{display:flex;justify-content:space-between;gap:10px;align-items:center}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.heatCell{padding:8px 3px;border-radius:8px;background:#e4eeee;text-align:center;font-size:10px}
.heatCell b{font-size:13px}.barrow{display:grid;grid-template-columns:1.4fr 3fr 32px;gap:7px;align-items:center;margin:7px 0;font-size:12px}.bar{height:9px;background:#e5eeee;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}
.navadd{position:fixed;right:17px;bottom:17px;width:58px;height:58px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:31px;box-shadow:0 6px 18px #0003;z-index:20}
.sep{height:1px;background:var(--line);margin:12px 0}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#edf3f3;color:#5b7276;display:inline-block}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}.right{text-align:right}
.range{display:flex;gap:7px;margin:10px 0 2px}.range button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 5px;font-weight:800;color:var(--muted)}.range button.on{background:var(--teal2);border-color:var(--teal);color:var(--teal)}
.chart{height:190px;display:flex;align-items:flex-end;gap:4px;padding:10px 4px 25px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.col{flex:1;min-width:5px;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}.col span{display:block;width:80%;min-height:2px;background:var(--teal);border-radius:5px 5px 1px 1px}.col i{position:absolute;bottom:-20px;font-style:normal;font-size:9px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--teal);margin-right:4px}.dot.med{background:var(--amber)}.dot.high{background:var(--red)}
.timelineChart{position:relative;height:150px;border:1px solid var(--line);border-radius:12px;background:#fbfdfd;margin-top:10px;overflow:hidden}.axisline{position:absolute;left:0;right:0;height:1px;background:#e7eeee}.eventdot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,50%);background:var(--teal)}.eventdot.high{background:var(--red);width:13px;height:13px}.medmark{position:absolute;top:8px;bottom:8px;width:2px;background:var(--amber);opacity:.75}.axislabel{position:absolute;bottom:2px;font-size:9px;color:var(--muted);transform:translateX(-50%)}
.insightStrong{font-weight:850;color:var(--ink)}.score{display:inline-block;border-radius:999px;background:var(--teal2);color:var(--teal);font-weight:900;padding:4px 8px;font-size:11px}

@media(max-width:420px){.brand{font-size:25px}.tabs{top:74px}.page{padding-left:14px;padding-right:14px}.quickState{gap:4px}.quickState button{font-size:10px;padding:8px 2px}}
</style>
</head>
<body>
<header class="top"><div class="brandrow"><div><div class="brand">NeuroPattern</div><div class="tag">ABI behaviour • medication • pattern tracker</div></div><div id="activeBadge" class="activeBadge">Person 1</div></div></header>
<nav id="tabs" class="tabs"></nav>
<main id="app"></main>
<button id="quickAdd" class="navadd">+</button>
<script>
(function(){
"use strict";
var KEY="neuropattern-v6";
var APP_VERSION="7.0";
var OLD_KEYS=["neuropattern-v5","neuropattern-v4","neuropattern-v3"];
var defaults={people:[{id:"p1",name:"Person 1",baseline:"",communication:"",riskNotes:""}],active:"p1",logs:[],meds:[],medLogs:[],handovers:[],settings:{showSafety:true}};
function clone(x){return JSON.parse(JSON.stringify(x));}
function loadState(){
  var d=null, raw=null;
  try{
    raw=localStorage.getItem(KEY);
    if(!raw){for(var i=0;i<OLD_KEYS.length&&!raw;i++)raw=localStorage.getItem(OLD_KEYS[i]);}
    if(raw)d=JSON.parse(raw);
  }catch(e){d=null;}
  if(!d||typeof d!=="object")d=clone(defaults);
  if(!Array.isArray(d.people)||!d.people.length)d.people=clone(defaults.people);
  ["logs","meds","medLogs","handovers"].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.settings)d.settings={showSafety:true};
  if(!d.active||!d.people.some(function(p){return p&&p.id===d.active;}))d.active=d.people[0].id;
  return d;
}
var state=loadState(), current="home", draftLevel=null, patternDays=7;
var tabDefs=[["home","Home"],["log","Log"],["timeline","Timeline"],["patterns","Patterns"],["meds","Meds"],["people","People"],["reports","Reports"]];
var behaviours=["Pacing","Repetitive questioning","Raised voice","Swearing","Verbal threats","Refusing care","Pushing / grabbing","Striking out","Kicking","Throwing objects","Property damage","Self-injury","Disinhibition","Other"];
var triggers=["Personal care","Medication due","Medication recently given","Pain / discomfort","Noise / overstimulation","Fatigue","Poor sleep","Hunger / thirst","Bowel / bladder discomfort","Change of routine","Transition / waiting","Unfamiliar person","Demand / request","Conflict / interaction","Unknown"];
var interventions=["Quiet space","Reassurance","Validation","Distraction / redirection","Reduced demands","Change of staff approach","Snack / drink","Pain relief as prescribed","PRN medication as prescribed","Sensory reduction","Preferred activity","Time alone / space","No intervention"];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function active(){return state.people.find(function(p){return p&&p.id===state.active;})||state.people[0];}
function mine(){return state.logs.filter(function(x){return x.person===state.active;});}
function medsMine(){return state.medLogs.filter(function(x){return x.person===state.active;});}
function todayKey(){return new Date().toISOString().slice(0,10);}
function levelName(n){return ["Calm","Unsettled","Agitated","Highly agitated","Aggressive"][Number(n)]||"Unknown";}
function renderTabs(){
  document.getElementById("activeBadge").textContent=active().name||"Profile";
  var el=document.getElementById("tabs");
  el.innerHTML=tabDefs.map(function(t){return '<button class="'+(current===t[0]?"on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){b.onclick=function(){current=b.dataset.tab;render();};});
}
function card(s,cls){return '<div class="card '+(cls||"")+'">'+s+'</div>';}
function chips(name,arr){return '<div class="row chips" data-name="'+name+'">'+arr.map(function(v){return '<button type="button" class="chip" data-v="'+esc(v)+'">'+esc(v)+'</button>';}).join("")+'</div>';}
function selected(name){return Array.prototype.map.call(document.querySelectorAll('.chips[data-name="'+name+'"] .chip.on'),function(x){return x.dataset.v;});}
function withinDays(ts,days){return (Date.now()-new Date(ts).getTime())<=days*86400000;}
function summary(days){
  var l=mine().filter(function(x){return withinDays(x.ts,days);});
  var severe=l.filter(function(x){return Number(x.level)>=3;});
  return {all:l,severe:severe,avg:l.length?(l.reduce(function(a,x){return a+Number(x.level||0);},0)/l.length):0};
}
function countMap(arr,field){
  var m={};arr.forEach(function(x){(x[field]||[]).forEach(function(v){m[v]=(m[v]||0)+1;});});return m;
}
function topKeys(m,n){return Object.keys(m).sort(function(a,b){return m[b]-m[a];}).slice(0,n);}
function insights(days){
  var l=summary(days).all, out=[];
  if(l.length<3)return out;
  var hour={}, factors=countMap(l,"triggers"), bh=countMap(l,"behaviours"), improves={}, outcomes={};
  l.forEach(function(x){
    var h=new Date(x.ts).getHours();hour[h]=(hour[h]||0)+Number(x.level||0);
    outcomes[x.outcome]=(outcomes[x.outcome]||0)+1;
    if(x.outcome==="Much calmer"||x.outcome==="Somewhat calmer")(x.interventions||[]).forEach(function(t){improves[t]=(improves[t]||0)+1;});
  });
  var peak=Object.keys(hour).sort(function(a,b){return hour[b]-hour[a];})[0];
  var fac=topKeys(factors,1)[0], beh=topKeys(bh,1)[0], intv=topKeys(improves,1)[0];
  if(peak!=null)out.push("Highest recorded intensity clusters around "+String(peak).padStart(2,"0")+":00.");
  if(fac)out.push("Most frequently recorded possible factor: "+fac+" ("+factors[fac]+" records).");
  if(beh)out.push("Most frequently recorded behaviour: "+beh+" ("+bh[beh]+" records).");
  if(intv)out.push(intv+" is the intervention most often recorded alongside improvement ("+improves[intv]+" times).");
  var severe=l.filter(function(x){return Number(x.level)>=3;});
  if(severe.length){
    var poor=severe.filter(function(x){return x.sleep==="Poor"||x.sleep==="Interrupted";}).length;
    var pain=severe.filter(function(x){return Number(x.pain||0)>=4;}).length;
    out.push(poor+" of "+severe.length+" high-intensity records followed poor or interrupted sleep.");
    out.push(pain+" of "+severe.length+" high-intensity records included pain rated 4/10 or above.");
  }
  var m=medsMine().filter(function(x){return withinDays(x.ts,days);});
  if(m.length&&severe.length){
    var near=0, after=0;
    severe.forEach(function(x){
      var xt=new Date(x.ts).getTime();
      if(m.some(function(mm){return Math.abs(xt-new Date(mm.ts).getTime())<=2*3600000;}))near++;
      if(m.some(function(mm){var d=xt-new Date(mm.ts).getTime();return d>=0&&d<=2*3600000;}))after++;
    });
    out.push(near+" of "+severe.length+" high-intensity records occurred within 2 hours either side of a recorded medication administration.");
    out.push(after+" of "+severe.length+" occurred in the 2 hours after a recorded medication administration. Timing association only.");
  }
  return out;
}
function dailySeries(days){
  var out=[], now=new Date();now.setHours(23,59,59,999);
  for(var i=days-1;i>=0;i--){
    var d=new Date(now);d.setDate(now.getDate()-i);var key=d.toISOString().slice(0,10);
    var rows=mine().filter(function(x){return x.date===key;});
    out.push({date:key,label:(d.getMonth()+1)+"/"+d.getDate(),count:rows.length,intensity:rows.reduce(function(a,x){return a+Number(x.level||0);},0),high:rows.filter(function(x){return Number(x.level)>=3;}).length});
  }
  return out;
}
function bars(series,field){
  var max=Math.max(1,...series.map(function(x){return x[field];}));
  return '<div class="chart">'+series.map(function(x,i){
    var show=series.length<=7||i===0||i===series.length-1||i%Math.max(1,Math.floor(series.length/5))===0;
    return '<div class="col" title="'+esc(x.date)+': '+x[field]+'"><span style="height:'+Math.max(2,100*x[field]/max)+'%"></span>'+(show?'<i>'+esc(x.label)+'</i>':'')+'</div>';
  }).join("")+'</div>';
}
function medicationBehaviourChart(days){
  var cutoff=Date.now()-days*86400000, logs=mine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;}), meds=medsMine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;});
  if(!logs.length&&!meds.length)return '<div class="empty">No behaviour or medication events in this period.</div>';
  var start=Date.now()-days*86400000, span=days*86400000;
  var dots=logs.slice(-100).map(function(x){var left=100*(new Date(x.ts).getTime()-start)/span,bottom=12+Number(x.level||0)*24;return '<span class="eventdot '+(Number(x.level)>=3?'high':'')+'" style="left:'+left+'%;bottom:'+bottom+'px" title="'+esc(levelName(x.level))+'"></span>';}).join("");
  var marks=meds.slice(-100).map(function(x){var left=100*(new Date(x.ts).getTime()-start)/span;return '<span class="medmark" style="left:'+left+'%" title="'+esc(x.name)+'"></span>';}).join("");
  return '<div class="timelineChart"><div class="axisline" style="bottom:36px"></div><div class="axisline" style="bottom:84px"></div><div class="axisline" style="bottom:132px"></div>'+marks+dots+'<span class="axislabel" style="left:1%">-'+days+'d</span><span class="axislabel" style="left:50%">mid</span><span class="axislabel" style="left:98%">now</span></div><div class="legend"><span><i class="dot"></i>behaviour</span><span><i class="dot high"></i>high intensity</span><span><i class="dot med"></i>medication time</span></div>';
}
function prnStats(days){
  var prn=medsMine().filter(function(x){return x.type==="PRN"&&withinDays(x.ts,days);});
  if(!prn.length)return {n:0,text:"No PRN administrations recorded in this period."};
  var improved=0, observed=0;
  prn.forEach(function(p){
    var pt=new Date(p.ts).getTime(), before=mine().filter(function(x){var d=pt-new Date(x.ts).getTime();return d>=0&&d<=2*3600000;}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts);})[0];
    var after=mine().filter(function(x){var d=new Date(x.ts).getTime()-pt;return d>=0&&d<=2*3600000;}).sort(function(a,b){return new Date(a.ts)-new Date(b.ts);})[0];
    if(before&&after){observed++;if(Number(after.level)<Number(before.level))improved++;}
  });
  return {n:prn.length,text:observed?improved+" of "+observed+" PRN administrations with comparable behaviour records had a lower recorded intensity within 2 hours.":"PRN administrations are recorded, but there are not enough before/after behaviour observations to compare."};
}
function homeView(){
  var t=todayKey(), l=mine().filter(function(x){return x.date===t;}), m=medsMine().filter(function(x){return x.date===t;}), ins=insights(7);
  return '<h1 class="h1">How are they right now? <span class="score">V7</span></h1><div class="p">One-tap status logging for routine observations, with detailed records when needed.</div>'+
  '<div class="quickState">'+
  [['0','🙂','Calm'],['1','😐','Unsettled'],['2','😣','Agitated'],['3','⚠️','High'],['4','🚨','Aggressive']].map(function(x){return '<button data-quick="'+x[0]+'" data-level="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>';}).join("")+
  '</div>'+
  '<div class="grid3"><div class="card stat"><div class="big">'+l.length+'</div><div class="small">today</div></div><div class="card stat"><div class="big">'+l.filter(function(x){return Number(x.level)>=3;}).length+'</div><div class="small">high intensity</div></div><div class="card stat"><div class="big">'+m.length+'</div><div class="small">med logs</div></div></div>'+
  '<button class="btn primary" data-go="log">Detailed behaviour / incident record</button>'+
  '<button class="btn secondary" data-go="meds">Medication administration</button>'+
  '<div class="h2">Pattern watch — last 7 days</div>'+
  (ins.length?ins.slice(0,3).map(function(x){return card('<div class="p">'+esc(x)+'</div>');}).join(""):card('<div class="empty">More observations are needed before a useful pattern can be identified.</div>'))+
  (state.settings.showSafety?card('<b>Observation, not diagnosis</b><div class="p">NeuroPattern summarises recorded associations. It does not prove medication causation and should not be used to change medication without the prescriber or clinical team.</div>','notice'):"");
}
function logView(){
  return '<h1 class="h1">Behaviour / incident record</h1><form id="logForm">'+
  '<div class="grid2"><div class="field"><div class="label">Entry type</div><select name="type"><option>Observation</option><option>Incident</option></select></div>'+
  '<div class="field"><div class="label">Intensity</div><select name="level" id="levelSelect"><option value="0">0 — Calm</option><option value="1">1 — Unsettled</option><option value="2">2 — Agitated</option><option value="3">3 — Highly agitated</option><option value="4">4 — Aggressive</option></select></div></div>'+
  '<div class="field"><div class="label">Behaviour</div>'+chips("behaviours",behaviours)+'</div>'+
  '<div class="field"><div class="label">Possible factors / antecedents</div>'+chips("triggers",triggers)+'</div>'+
  '<div class="field"><div class="label">What happened immediately before?</div><textarea name="antecedent" placeholder="Factual description of the antecedent"></textarea></div>'+
  '<div class="field"><div class="label">What happened immediately after?</div><textarea name="consequence" placeholder="Consequence / response / recovery"></textarea></div>'+
  '<div class="grid2"><div class="field"><div class="label">Pain 0–10</div><input class="inp" type="number" min="0" max="10" name="pain" value="0"></div>'+
  '<div class="field"><div class="label">Sleep</div><select name="sleep"><option>Unknown</option><option>Good</option><option>Interrupted</option><option>Poor</option></select></div></div>'+
  '<div class="field"><div class="label">Intervention / de-escalation</div>'+chips("interventions",interventions)+'</div>'+
  '<div class="field"><div class="label">Outcome</div><select name="outcome"><option>Not known</option><option>Much calmer</option><option>Somewhat calmer</option><option>No change</option><option>More agitated</option></select></div>'+
  '<div class="field row"><label class="chip"><input type="checkbox" name="injury"> Injury</label><label class="chip"><input type="checkbox" name="damage"> Property damage</label><label class="chip"><input type="checkbox" name="restrictive"> Restrictive intervention</label></div>'+
  '<div class="field"><div class="label">Duration (minutes)</div><input class="inp" type="number" min="0" name="duration" placeholder="Optional"></div>'+
  '<div class="field"><div class="label">Additional factual notes</div><textarea name="notes"></textarea></div>'+
  '<button class="btn primary">Save record</button></form>';
}
function timelineView(){
  var ev=mine().map(function(x){var y=Object.assign({},x);y.kind="beh";return y;})
  .concat(medsMine().map(function(x){var y=Object.assign({},x);y.kind="med";return y;}))
  .concat(state.handovers.filter(function(x){return x.person===state.active;}).map(function(x){var y=Object.assign({},x);y.kind="handover";return y;}))
  .sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
  var head='<h1 class="h1">24-hour timeline</h1><div class="p">Behaviour, medication and handover entries in one chronological view.</div>';
  if(!ev.length)return head+card('<div class="empty">No entries yet.</div>');
  return head+ev.slice(0,150).map(function(x){
    if(x.kind==="med")return '<div class="card event"><div class="eventHead"><div class="eventTitle">💊 '+esc(x.name)+'</div><div class="muted">'+new Date(x.ts).toLocaleString()+'</div></div><div class="p">'+esc(x.dose||"")+' • '+esc(x.type||"Regular")+'</div></div>';
    if(x.kind==="handover")return '<div class="card event amber"><div class="eventHead"><div class="eventTitle">📝 Handover</div><div class="muted">'+new Date(x.ts).toLocaleString()+'</div></div><div class="p">'+esc(x.note)+'</div></div>';
    return '<div class="card event '+(Number(x.level)>=3?"red":"")+'"><div class="eventHead"><div class="eventTitle">'+esc(x.type)+' • '+esc(levelName(x.level))+'</div><div class="muted">'+new Date(x.ts).toLocaleString()+'</div></div>'+
      '<div class="p">'+esc((x.behaviours||[]).join(", ")||"No behaviour selected")+'</div><div class="muted">Possible factors: '+esc((x.triggers||[]).join(", ")||"not recorded")+'</div>'+
      (x.duration?'<div class="pill">'+esc(x.duration)+' min</div>':'')+(x.injury?'<div class="pill">injury</div>':'')+(x.damage?'<div class="pill">property damage</div>':'')+'</div>';
  }).join("");
}
function patternsView(){
  var days=patternDays, s=summary(days), ins=insights(days), hours=new Array(24).fill(0), factors={}, interventions={}, series=dailySeries(days), prn=prnStats(days);
  s.all.forEach(function(x){
    hours[new Date(x.ts).getHours()]+=Number(x.level||0);
    (x.triggers||[]).forEach(function(t){factors[t]=(factors[t]||0)+1;});
    if(x.outcome==="Much calmer"||x.outcome==="Somewhat calmer")(x.interventions||[]).forEach(function(t){interventions[t]=(interventions[t]||0)+1;});
  });
  var top=topKeys(factors,8), max=Math.max(1,...top.map(function(k){return factors[k];}));
  var topInt=topKeys(interventions,6), maxInt=Math.max(1,...topInt.map(function(k){return interventions[k];}));
  return '<h1 class="h1">Pattern Intelligence</h1><div class="p">Visual trends and recorded associations for '+esc(active().name)+'.</div>'+
  '<div class="range"><button data-range="7" class="'+(days===7?'on':'')+'">7 days</button><button data-range="30" class="'+(days===30?'on':'')+'">30 days</button><button data-range="90" class="'+(days===90?'on':'')+'">90 days</button></div>'+
  '<div class="grid3"><div class="card stat"><div class="big">'+s.all.length+'</div><div class="small">records</div></div><div class="card stat"><div class="big">'+s.severe.length+'</div><div class="small">high intensity</div></div><div class="card stat"><div class="big">'+s.avg.toFixed(1)+'</div><div class="small">avg intensity</div></div></div>'+
  card('<b>Association, not causation</b><div class="p">Pattern Intelligence summarises what was recorded together or close in time. It does not establish that medication, pain, sleep, a person or an event caused behaviour.</div>','notice')+
  '<div class="h2">Daily behaviour intensity</div>'+bars(series,"intensity")+
  '<div class="h2">Medication ↔ behaviour timeline</div>'+medicationBehaviourChart(days)+
  '<div class="h2">Pattern observations</div>'+(ins.length?ins.map(function(x){return card('<div class="p insightStrong">'+esc(x)+'</div>');}).join(""):card('<div class="empty">At least 3 records are needed for useful pattern observations.</div>'))+
  '<div class="h2">PRN review</div>'+card('<span class="score">'+prn.n+' PRN</span><div class="p">'+esc(prn.text)+'</div>')+
  '<div class="h2">24-hour intensity heatmap</div><div class="heat">'+hours.map(function(v,i){return '<div class="heatCell">'+String(i).padStart(2,"0")+'<br><b>'+v+'</b></div>';}).join("")+'</div>'+
  '<div class="h2">Possible factors</div>'+(top.length?top.map(function(k){return '<div class="barrow"><span>'+esc(k)+'</span><div class="bar"><span style="width:'+(100*factors[k]/max)+'%"></span></div><b>'+factors[k]+'</b></div>';}).join(""):card('<div class="empty">No factor data yet.</div>'))+
  '<div class="h2">Interventions recorded with improvement</div>'+(topInt.length?topInt.map(function(k){return '<div class="barrow"><span>'+esc(k)+'</span><div class="bar"><span style="width:'+(100*interventions[k]/maxInt)+'%"></span></div><b>'+interventions[k]+'</b></div>';}).join(""):card('<div class="empty">No improvement/intervention data yet.</div>'));
}
function medsView(){
  var list=state.meds.filter(function(m){return m.person===state.active;}), recent=medsMine().slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts);}).slice(0,8);
  var html='<h1 class="h1">Medication</h1><div class="p">Record actual administration time for regular and PRN medication.</div>';
  html+=list.length?list.map(function(m){return '<div class="card"><div class="profile"><div><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.dose||"")+' • '+esc(m.schedule||"No schedule entered")+'</div></div><span class="pill">'+esc(m.kind||"Regular")+'</span></div><div class="grid2"><button class="btn secondary give" data-id="'+esc(m.id)+'" data-type="Regular">Given now</button><button class="btn secondary give" data-id="'+esc(m.id)+'" data-type="PRN">PRN now</button></div></div>';}).join(""):card('<div class="empty">No medications added yet.</div>');
  html+='<div class="h2">Add medication</div><form id="medForm"><input class="inp" name="name" placeholder="Medication name" required><div class="grid2"><input class="inp" name="dose" placeholder="Dose"><input class="inp" name="schedule" placeholder="Time e.g. 20:00"></div><select name="kind"><option>Regular</option><option>PRN</option></select><button class="btn primary">Add medication</button></form>';
  if(recent.length){html+='<div class="h2">Recent administrations</div>'+recent.map(function(x){return card('<div class="profile"><div><b>'+esc(x.name)+'</b><div class="muted">'+new Date(x.ts).toLocaleString()+' • '+esc(x.type)+'</div></div><div>'+esc(x.dose||"")+'</div>');}).join("");}
  return html;
}
function peopleView(){
  var html='<h1 class="h1">People / service users</h1><div class="p">Each profile keeps separate behaviour, medication and handover records on this device.</div>';
  html+=state.people.map(function(p){return '<div class="card"><div class="profile"><div><b>'+esc(p.name)+'</b><div class="muted">'+state.logs.filter(function(x){return x.person===p.id;}).length+' behaviour records</div></div><button class="chip selectPerson '+(p.id===state.active?"on":"")+'" data-id="'+esc(p.id)+'">'+(p.id===state.active?"Active":"Select")+'</button></div>'+
  ((p.baseline||p.communication||p.riskNotes)?'<div class="sep"></div><div class="muted">'+(p.baseline?'Baseline: '+esc(p.baseline)+'<br>':'')+(p.communication?'Communication: '+esc(p.communication)+'<br>':'')+(p.riskNotes?'Key risks: '+esc(p.riskNotes):'')+'</div>':'')+'</div>';}).join("");
  html+='<div class="h2">Add person</div><form id="personForm"><input class="inp" name="name" placeholder="Preferred name / identifier" required><textarea name="baseline" placeholder="Usual baseline presentation"></textarea><textarea name="communication" placeholder="Communication preferences / support"></textarea><textarea name="riskNotes" placeholder="Key risk or safety notes"></textarea><button class="btn primary">Add profile</button></form>';
  return html;
}
function handoverSummary(){
  var cutoff=Date.now()-12*3600000,l=mine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;}),m=medsMine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;}),sev=l.filter(function(x){return Number(x.level)>=3;});
  var pieces=["Last 12h: "+l.length+" behaviour/mood records",sev.length+" high-intensity",m.length+" medication administrations"];
  if(sev.length)pieces.push("Latest high-intensity record: "+new Date(sev[sev.length-1].ts).toLocaleString());
  var i=insights(7);if(i.length)pieces.push("7-day pattern: "+i[0]);
  return pieces.join(". ")+".";
}
function reportsView(){
  var html='<h1 class="h1">Reports & handover</h1>'+
  card('<b>Auto handover snapshot</b><div class="p">'+esc(handoverSummary())+'</div>','notice')+
  '<form id="handoverForm"><div class="field"><div class="label">Shift handover note</div><textarea name="note" required placeholder="Concise, factual, relevant to the next shift"></textarea></div><button class="btn primary">Save handover</button></form>'+
  '<div class="h2">Export / backup</div><div class="card"><button class="btn secondary" id="csvBtn">Export behaviour CSV</button><button class="btn secondary" id="jsonBtn">Export full backup JSON</button><button class="btn secondary" id="importBtn">Import backup JSON</button><input id="importFile" type="file" accept="application/json" style="display:none"></div>';
  var hs=state.handovers.filter(function(h){return h.person===state.active;}).slice().reverse().slice(0,10);
  if(hs.length)html+='<div class="h2">Recent handovers</div>'+hs.map(function(h){return card('<div class="muted">'+new Date(h.ts).toLocaleString()+'</div><div class="p">'+esc(h.note)+'</div>');}).join("");
  return html;
}
function render(){
  try{
    renderTabs();
    var views={home:homeView,log:logView,timeline:timelineView,patterns:patternsView,meds:medsView,people:peopleView,reports:reportsView};
    document.getElementById("app").innerHTML='<div class="page">'+views[current]()+'</div>';
    bind();
    if(current==="log"&&draftLevel!==null){var ls=document.getElementById("levelSelect");if(ls){ls.value=String(draftLevel);}draftLevel=null;}
  }catch(err){
    console.error(err);
    document.getElementById("tabs").innerHTML="";
    document.getElementById("app").innerHTML='<div class="page"><h1 class="h1">NeuroPattern</h1>'+card('<b>Dashboard recovery</b><div class="p">A local data error prevented the dashboard from loading. You can reset NeuroPattern local data and reopen the app.</div><button class="btn dangerBtn" id="resetBtn">Reset local app data</button>','danger')+'</div>';
    var r=document.getElementById("resetBtn");if(r)r.onclick=resetData;
  }
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){current=b.dataset.go;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-range]"),function(b){b.onclick=function(){patternDays=Number(b.dataset.range);render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-quick]"),function(b){b.onclick=function(){draftLevel=Number(b.dataset.quick);current="log";render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".chips .chip"),function(b){b.onclick=function(){b.classList.toggle("on");};});
  Array.prototype.forEach.call(document.querySelectorAll(".selectPerson"),function(b){b.onclick=function(){state.active=b.dataset.id;save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".give"),function(b){b.onclick=function(){var m=state.meds.find(function(x){return x.id===b.dataset.id;}),d=new Date();if(!m)return;state.medLogs.push({id:String(Date.now()),person:state.active,medId:m.id,name:m.name,dose:m.dose,type:b.dataset.type,ts:d.toISOString(),date:d.toISOString().slice(0,10)});save();render();};});
  var f=document.getElementById("logForm");if(f)f.onsubmit=function(e){e.preventDefault();var fd=new FormData(f),d=new Date();state.logs.push({id:String(Date.now()),person:state.active,ts:d.toISOString(),date:d.toISOString().slice(0,10),type:fd.get("type"),level:Number(fd.get("level")),behaviours:selected("behaviours"),triggers:selected("triggers"),antecedent:fd.get("antecedent"),consequence:fd.get("consequence"),pain:Number(fd.get("pain")||0),sleep:fd.get("sleep"),interventions:selected("interventions"),outcome:fd.get("outcome"),injury:fd.get("injury")==="on",damage:fd.get("damage")==="on",restrictive:fd.get("restrictive")==="on",duration:Number(fd.get("duration")||0),notes:fd.get("notes")});save();current="timeline";render();};
  var mf=document.getElementById("medForm");if(mf)mf.onsubmit=function(e){e.preventDefault();var fd=new FormData(mf);state.meds.push({id:String(Date.now()),person:state.active,name:fd.get("name"),dose:fd.get("dose"),schedule:fd.get("schedule"),kind:fd.get("kind")});save();render();};
  var pf=document.getElementById("personForm");if(pf)pf.onsubmit=function(e){e.preventDefault();var fd=new FormData(pf),id="p"+Date.now();state.people.push({id:id,name:fd.get("name"),baseline:fd.get("baseline"),communication:fd.get("communication"),riskNotes:fd.get("riskNotes")});state.active=id;save();render();};
  var hf=document.getElementById("handoverForm");if(hf)hf.onsubmit=function(e){e.preventDefault();var fd=new FormData(hf);state.handovers.push({id:String(Date.now()),person:state.active,ts:new Date().toISOString(),note:fd.get("note")});save();render();};
  var jb=document.getElementById("jsonBtn");if(jb)jb.onclick=exportJSON;
  var cb=document.getElementById("csvBtn");if(cb)cb.onclick=exportCSV;
  var ib=document.getElementById("importBtn"), fi=document.getElementById("importFile");if(ib&&fi){ib.onclick=function(){fi.click();};fi.onchange=importJSON;}
}
function download(name,text,type){var blob=new Blob([text],{type:type}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);}
function exportJSON(){download("NeuroPattern-backup.json",JSON.stringify(state,null,2),"application/json");}
function exportCSV(){
  var rows=[["timestamp","type","level","behaviours","possible_factors","antecedent","consequence","pain","sleep","interventions","outcome","injury","property_damage","restrictive_intervention","duration_minutes","notes"]];
  mine().forEach(function(x){rows.push([x.ts,x.type,x.level,(x.behaviours||[]).join("; "),(x.triggers||[]).join("; "),x.antecedent,x.consequence,x.pain,x.sleep,(x.interventions||[]).join("; "),x.outcome,x.injury,x.damage,x.restrictive,x.duration,x.notes]);});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download("NeuroPattern-behaviour.csv",csv,"text/csv");
}
function importJSON(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(!d||!Array.isArray(d.people))throw new Error("Invalid");state=d;save();alert("Backup imported.");current="home";render();}catch(err){alert("That file is not a valid NeuroPattern backup.");}};reader.readAsText(file);
}
function resetData(){try{[KEY].concat(OLD_KEYS).forEach(function(k){localStorage.removeItem(k);});}catch(e){}location.reload();}
document.getElementById("quickAdd").onclick=function(){draftLevel=null;current="log";render();};
render();
})();
</script>
