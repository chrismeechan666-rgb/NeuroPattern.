<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>NeuroPattern</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f7f7;color:#173f44}body{margin:0}.top{background:#fff;padding:18px;border-bottom:1px solid #dfe9e9;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.sub{font-size:12px;color:#668085}.tabs{display:flex;overflow:auto;background:#fff;border-bottom:1px solid #dfe9e9;position:sticky;top:77px;z-index:4}.tabs button{flex:1;min-width:82px;border:0;background:#fff;padding:13px 8px;color:#6d8488}.tabs button.on{font-weight:800;color:#176b68;border-bottom:3px solid #176b68}.page{padding:18px 18px 80px}.h1{font-size:25px;font-weight:800;margin:0 0 8px}.p{font-size:14px;line-height:1.45;color:#486166}.btn{width:100%;padding:14px 16px;border-radius:13px;border:0;font-weight:800;margin-top:10px}.primary{background:#176b68;color:#fff}.secondary{background:#fff;color:#176b68;border:1px solid #c9dada}.card{background:#fff;border:1px solid #e0eaea;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;border-radius:18px;border:1px solid #c9d9da;background:#fff;color:#4d666a}.chip.on{background:#ddefea;border-color:#176b68;color:#155b58;font-weight:800}.field{margin-top:14px}.label{font-size:13px;font-weight:800;margin-bottom:7px}.inp,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d5e1e1;border-radius:12px;background:#fff;font:inherit}textarea{min-height:78px}.stats{display:flex;gap:8px}.stat{flex:1}.big{font-size:22px;font-weight:800}.muted{font-size:12px;color:#74888c}.event{border-left:4px solid #176b68}.danger{border-left-color:#a43d3d}.notice{background:#eef4f5}.hidden{display:none}.profileCard{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px}.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.heat div{background:#dfeaea;padding:8px 3px;text-align:center;border-radius:8px;font-size:11px}.heat .h1x{background:#c6dddd}.heat .h2x{background:#a9cccc}.heat .h3x{background:#80b1b1}.heat .h4x{background:#4d8584;color:#fff}.navadd{position:fixed;right:18px;bottom:18px;border-radius:50%;width:58px;height:58px;background:#176b68;color:white;border:0;font-size:30px;box-shadow:0 4px 14px #0003}.dangerText{color:#9a3434}.kicker{font-size:11px;font-weight:900;letter-spacing:1px;color:#43787a}.divider{height:1px;background:#edf2f2;margin:12px 0}
</style></head><body><div class='top'><div class='brand'>NeuroPattern</div><div class='sub'>ABI behaviour • medication • pattern tracker</div></div><div class='tabs' id='tabs'></div><main id='app'></main><button class='navadd' onclick="show('log')">+</button>
<script>
const S='neuropattern-v3'; const state=JSON.parse(localStorage.getItem(S)||'null')||{people:[{id:'p1',name:'Person 1',notes:''}],active:'p1',logs:[],meds:[],medLogs:[],handovers:[]};
const tabs=[['home','Home'],['log','Log'],['timeline','Timeline'],['patterns','Patterns'],['meds','Meds'],['people','People'],['reports','Reports']]; let current='home';
const behaviours=['Pacing','Repetitive questioning','Raised voice','Swearing','Verbal threats','Refusing care','Pushing / grabbing','Striking out','Kicking','Throwing objects','Property damage','Self-injury','Disinhibition','Other'];
const triggers=['Personal care','Medication due','Medication recently given','Pain / discomfort','Noise / overstimulation','Fatigue','Poor sleep','Hunger / thirst','Bowel / bladder discomfort','Change of routine','Transition / waiting','Unfamiliar person','Demand / request','Conflict / interaction','Unknown'];
const interventions=['Quiet space','Reassurance','Validation','Distraction / redirection','Reduced demands','Change of staff approach','Snack / drink','Pain relief as prescribed','PRN medication as prescribed','Sensory reduction','Preferred activity','Time alone / space','No intervention'];
function save(){localStorage.setItem(S,JSON.stringify(state))} function active(){return state.people.find(p=>p.id===state.active)||state.people[0]} function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(t){current=t;render()} function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class='${current===k?'on':''}' onclick="show('${k}')">${l}</button>`).join('')}
function render(){renderTabs(); const a=document.getElementById('app'); a.innerHTML=`<div class='page'>${views[current]()}</div>`; bind()}
const mine=()=>state.logs.filter(x=>x.person===state.active); const medMine=()=>state.medLogs.filter(x=>x.person===state.active);
const views={home(){let l=mine(),today=new Date().toISOString().slice(0,10),tl=l.filter(x=>x.date===today);return `<div class='kicker'>TODAY • ${esc(active().name)}</div><h1 class='h1'>How are they right now?</h1><div class='p'>Record routine observations or significant incidents, then compare them with medication, sleep, pain and common antecedents.</div><button class='btn primary' onclick="show('log')">+ Log behaviour / mood</button><button class='btn secondary' onclick="show('meds')">+ Log medication</button><div class='stats' style='margin-top:14px'><div class='card stat'><div class='big'>${tl.length}</div><div class='muted'>entries</div></div><div class='card stat'><div class='big'>${tl.filter(x=>x.level>=3).length}</div><div class='muted'>high intensity</div></div><div class='card stat'><div class='big'>${medMine().filter(x=>x.date===today).length}</div><div class='muted'>med logs</div></div></div><div class='card'><b>Pattern watch</b><div class='p' style='margin-top:6px'>${esc(insights()[0]||'More observations are needed before a useful pattern can be identified.')}</div></div><div class='card notice'><b>Observation, not diagnosis</b><div class='p'>The app reports associations in recorded observations. It does not prove that medication or another factor caused aggression and does not recommend medication changes.</div></div>`},
log(){return `<h1 class='h1'>New behaviour record</h1><form id='logForm'><div class='field'><div class='label'>Entry type</div><select name='type'><option>Observation</option><option>Incident</option></select></div><div class='field'><div class='label'>Intensity</div><select name='level'><option value='0'>0 — Calm</option><option value='1'>1 — Unsettled</option><option value='2'>2 — Agitated</option><option value='3'>3 — Highly agitated</option><option value='4'>4 — Aggressive</option></select></div><div class='field'><div class='label'>Behaviour</div><div class='row chips' data-name='behaviours'>${behaviours.map(x=>`<button type='button' class='chip' data-v='${esc(x)}'>${esc(x)}</button>`).join('')}</div></div><div class='field'><div class='label'>Possible factors immediately before</div><div class='row chips' data-name='triggers'>${triggers.map(x=>`<button type='button' class='chip' data-v='${esc(x)}'>${esc(x)}</button>`).join('')}</div></div><div class='field'><div class='label'>Antecedent</div><textarea name='antecedent' placeholder='What happened immediately before?'></textarea></div><div class='field'><div class='label'>Consequence</div><textarea name='consequence' placeholder='What happened immediately after?'></textarea></div><div class='field'><div class='label'>Pain 0–10</div><input class='inp' type='number' min='0' max='10' name='pain' value='0'></div><div class='field'><div class='label'>Sleep</div><select name='sleep'><option>Unknown</option><option>Good</option><option>Interrupted</option><option>Poor</option></select></div><div class='field'><div class='label'>Intervention used</div><div class='row chips' data-name='interventions'>${interventions.map(x=>`<button type='button' class='chip' data-v='${esc(x)}'>${esc(x)}</button>`).join('')}</div></div><div class='field'><div class='label'>Outcome</div><select name='outcome'><option>Not known</option><option>Much calmer</option><option>Somewhat calmer</option><option>No change</option><option>More agitated</option></select></div><div class='field'><div class='label'>Incident details</div><label><input type='checkbox' name='injury'> Injury occurred</label><br><label><input type='checkbox' name='damage'> Property damage</label></div><div class='field'><div class='label'>Notes</div><textarea name='notes'></textarea></div><button class='btn primary'>Save record</button></form>`},
timeline(){let ev=[...mine().map(x=>({...x,kind:'beh'})),...medMine().map(x=>({...x,kind:'med'}))].sort((a,b)=>new Date(b.ts)-new Date(a.ts));return `<h1 class='h1'>Timeline</h1>${ev.length?ev.slice(0,100).map(x=>x.kind==='med'?`<div class='card event'><b>${new Date(x.ts).toLocaleString()} • Medication</b><div>${esc(x.name)} ${esc(x.dose||'')}</div><div class='muted'>${esc(x.type||'Regular')}</div></div>`:`<div class='card event ${x.level>=3?'danger':''}'><b>${new Date(x.ts).toLocaleString()} • ${esc(x.type)}</b><div>Intensity ${x.level}/4 • ${esc((x.behaviours||[]).join(', ')||'No behaviour selected')}</div><div class='muted'>Before: ${esc((x.triggers||[]).join(', ')||'not recorded')}</div></div>`).join(''):`<div class='card'>No entries yet.</div>`},
patterns(){let ins=insights(), counts={}; mine().forEach(l=>(l.triggers||[]).forEach(t=>counts[t]=(counts[t]||0)+1));let top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);let hours=Array(24).fill(0);mine().forEach(l=>hours[new Date(l.ts).getHours()]+=Number(l.level||0));return `<h1 class='h1'>Patterns</h1><div class='card notice'><b>Association only</b><div class='p'>These summaries support review; they do not identify a medical cause.</div></div>${ins.map((x,i)=>`<div class='card'><b>${i+1}. Pattern observation</b><div class='p'>${esc(x)}</div></div>`).join('')}<div class='field'><div class='label'>24-hour intensity heatmap</div><div class='heat'>${hours.map((v,i)=>`<div class='h${Math.min(4,Math.ceil(v/3))}x'>${String(i).padStart(2,'0')}<br><b>${v}</b></div>`).join('')}</div></div><div class='field'><div class='label'>Most recorded possible factors</div>${top.map(([k,v])=>`<div class='card profileCard'><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="card">No data yet.</div>'}</div>`},
meds(){let list=state.meds.filter(m=>m.person===state.active);return `<h1 class='h1'>Medication</h1><div class='p'>Record actual administration times. PRN and regular medication are kept separate.</div>${list.map(m=>`<div class='card profileCard'><div><b>${esc(m.name)}</b><div class='muted'>${esc(m.dose||'')} • ${esc(m.schedule||'PRN')}</div></div><div><button class='chip' onclick="giveMed('${m.id}','Regular')">Given</button> <button class='chip' onclick="giveMed('${m.id}','PRN')">PRN</button></div></div>`).join('')}<form id='medForm'><div class='field'><div class='label'>Add medication</div><input class='inp' name='name' placeholder='Medication name' required></div><input class='inp' name='dose' placeholder='Dose (optional)'><input class='inp' name='schedule' placeholder='Scheduled time e.g. 20:00'><button class='btn secondary'>Add medication</button></form>`},
people(){return `<h1 class='h1'>People / service users</h1><div class='p'>Keep each person's records separate on this device.</div>${state.people.map(p=>`<div class='card profileCard'><div><b>${esc(p.name)}</b><div class='muted'>${state.logs.filter(x=>x.person===p.id).length} behaviour records</div></div><button class='chip ${p.id===state.active?'on':''}' onclick="selectPerson('${p.id}')">${p.id===state.active?'Active':'Select'}</button></div>`).join('')}<form id='personForm'><div class='field'><div class='label'>Add person</div><input class='inp' name='name' placeholder='Preferred name / identifier' required></div><textarea name='notes' placeholder='Baseline / communication notes'></textarea><button class='btn secondary'>Add person</button></form>`},
reports(){return `<h1 class='h1'>Reports & handover</h1><div class='card'><b>Clinical review summary</b><div class='p'>Creates a de-identified JSON backup or CSV behaviour log from the active person's records.</div><button class='btn secondary' onclick='exportCSV()'>Export behaviour CSV</button><button class='btn secondary' onclick='exportJSON()'>Export full backup JSON</button></div><form id='handoverForm'><div class='field'><div class='label'>Shift handover note</div><textarea name='note' required placeholder='Concise factual handover note'></textarea></div><button class='btn primary'>Save handover</button></form>${state.handovers.filter(h=>h.person===state.active).slice().reverse().slice(0,8).map(h=>`<div class='card'><div class='muted'>${new Date(h.ts).toLocaleString()}</div><div>${esc(h.note)}</div></div>`).join('')}`}}
function bind(){document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>b.classList.toggle('on')); let f=document.getElementById('logForm');if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f), now=new Date(), getCh=n=>[...document.querySelectorAll(`.chips[data-name="${n}"] .chip.on`)].map(x=>x.dataset.v);state.logs.push({id:Date.now()+'',person:state.active,ts:now.toISOString(),date:now.toISOString().slice(0,10),type:fd.get('type'),level:+fd.get('level'),behaviours:getCh('behaviours'),triggers:getCh('triggers'),interventions:getCh('interventions'),antecedent:fd.get('antecedent'),consequence:fd.get('consequence'),pain:+fd.get('pain'),sleep:fd.get('sleep'),outcome:fd.get('outcome'),injury:fd.get('injury')==='on',damage:fd.get('damage')==='on',notes:fd.get('notes')});save();show('timeline')}; let mf=document.getElementById('medForm');if(mf)mf.onsubmit=e=>{e.preventDefault();let fd=new FormData(mf);state.meds.push({id:Date.now()+'',person:state.active,name:fd.get('name'),dose:fd.get('dose'),schedule:fd.get('schedule')});save();render()}; let pf=document.getElementById('personForm');if(pf)pf.onsubmit=e=>{e.preventDefault();let fd=new FormData(pf),id='p'+Date.now();state.people.push({id,name:fd.get('name'),notes:fd.get('notes')});state.active=id;save();render()};let hf=document.getElementById('handoverForm');if(hf)hf.onsubmit=e=>{e.preventDefault();let fd=new FormData(hf);state.handovers.push({id:Date.now()+'',person:state.active,ts:new Date().toISOString(),note:fd.get('note')});save();render()}}
function selectPerson(id){state.active=id;save();render()} function giveMed(id,type){let m=state.meds.find(x=>x.id===id),d=new Date();state.medLogs.push({id:Date.now()+'',person:state.active,medId:id,name:m.name,dose:m.dose,type,ts:d.toISOString(),date:d.toISOString().slice(0,10)});save();render()}
function insights(){let l=mine();if(l.length<2)return[];let r=[],sev=l.filter(x=>x.level>=3),h={};l.forEach(x=>{let k=new Date(x.ts).getHours();h[k]=(h[k]||0)+x.level});let peak=Object.entries(h).sort((a,b)=>b[1]-a[1])[0];if(peak)r.push(`Recorded behaviour intensity is currently highest around ${String(peak[0]).padStart(2,'0')}:00.`);let c={};l.forEach(x=>(x.triggers||[]).forEach(t=>c[t]=(c[t]||0)+1));let top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(top)r.push(`“${top[0]}” is the most frequently recorded possible factor (${top[1]} records).`);if(sev.length){let poor=sev.filter(x=>['Poor','Interrupted'].includes(x.sleep)).length;r.push(`${poor} of ${sev.length} high-intensity records followed poor or interrupted sleep.`)}if(sev.length&&medMine().length){let close=sev.filter(x=>medMine().some(m=>Math.abs(new Date(x.ts)-new Date(m.ts))<=7200000)).length;r.push(`${close} of ${sev.length} high-intensity records occurred within two hours before or after a recorded medication administration. This is a timing association only.`)}let imp=l.filter(x=>['Much calmer','Somewhat calmer'].includes(x.outcome));if(imp.length)r.push(`${imp.length} records document improvement after an intervention.`);return r}
function dl(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){dl('NeuroPattern-backup.json',JSON.stringify(state,null,2),'application/json')}function exportCSV(){let rows=[['timestamp','type','level','behaviours','possible_factors','antecedent','consequence','pain','sleep','interventions','outcome','injury','property_damage','notes'],...mine().map(x=>[x.ts,x.type,x.level,(x.behaviours||[]).join('; '),(x.triggers||[]).join('; '),x.antecedent,x.consequence,x.pain,x.sleep,(x.interventions||[]).join('; '),x.outcome,x.injury,x.damage,x.notes])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');dl('NeuroPattern-behaviour.csv',csv,'text/csv')}
render();</script></body></html>
