<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NeuroPattern</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f7f7;color:#173f44}
*{box-sizing:border-box}body{margin:0;background:#f3f7f7}.top{background:white;padding:18px;border-bottom:1px solid #dfe9e9;position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:850}.sub{font-size:13px;color:#668085;margin-top:2px}.tabs{display:flex;overflow-x:auto;background:white;border-bottom:1px solid #dfe9e9;position:sticky;top:82px;z-index:4}
.tabs button{border:0;background:white;padding:13px 14px;color:#667f83;white-space:nowrap;font-weight:650}.tabs button.on{color:#176b68;border-bottom:3px solid #176b68}
.page{padding:18px 18px 90px}.h1{font-size:25px;font-weight:850;margin:0 0 8px}.p{font-size:14px;line-height:1.5;color:#4b6468}.card{background:white;border:1px solid #e0eaea;border-radius:14px;padding:14px;margin-top:12px}
.btn{width:100%;padding:14px;border-radius:13px;border:0;font-weight:800;margin-top:10px}.primary{background:#176b68;color:#fff}.secondary{background:#fff;color:#176b68;border:1px solid #c9dada}
.field{margin-top:14px}.label{font-size:13px;font-weight:800;margin-bottom:7px}.inp,select,textarea{width:100%;padding:11px;border:1px solid #d5e1e1;border-radius:12px;background:#fff;font:inherit}
textarea{min-height:82px}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;border-radius:18px;border:1px solid #c9d9da;background:#fff;color:#4d666a}
.chip.on{background:#ddefea;border-color:#176b68;color:#155b58;font-weight:800}.stats{display:flex;gap:8px}.stat{flex:1}.big{font-size:22px;font-weight:850}.muted{font-size:12px;color:#74888c}
.event{border-left:4px solid #176b68}.danger{border-left-color:#a43d3d}.notice{background:#eef4f5}.profile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.navadd{position:fixed;right:18px;bottom:18px;border-radius:50%;width:58px;height:58px;background:#176b68;color:white;border:0;font-size:30px;box-shadow:0 4px 14px #0003;z-index:9}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.heat div{background:#dfeaea;padding:8px 3px;text-align:center;border-radius:8px;font-size:11px}
</style>
</head>
<body>
<div class="top"><div class="brand">NeuroPattern</div><div class="sub">ABI behaviour • medication • pattern tracker</div></div>
<div id="tabs" class="tabs"></div>
<main id="app"></main>
<button class="navadd" id="quickAdd">+</button>
<script>
(function(){
"use strict";
var KEY="neuropattern-v5";
var defaults={people:[{id:"p1",name:"Person 1",notes:""}],active:"p1",logs:[],meds:[],medLogs:[],handovers:[]};
function cloneDefault(){return JSON.parse(JSON.stringify(defaults));}
function loadState(){
  var d=null;
  try{
    var raw=localStorage.getItem(KEY)||localStorage.getItem("neuropattern-v4")||localStorage.getItem("neuropattern-v3");
    if(raw){ d=JSON.parse(raw); }
  }catch(e){ d=null; }
  if(!d||typeof d!=="object"){d=cloneDefault();}
  if(!Array.isArray(d.people)||!d.people.length){d.people=cloneDefault().people;}
  ["logs","meds","medLogs","handovers"].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.active||!d.people.some(function(p){return p&&p.id===d.active;})){d.active=d.people[0].id;}
  return d;
}
var state=loadState();
var current="home";
var tabs=[["home","Home"],["log","Log"],["timeline","Timeline"],["patterns","Patterns"],["meds","Meds"],["people","People"],["reports","Reports"]];
var behaviours=["Pacing","Repetitive questioning","Raised voice","Swearing","Verbal threats","Refusing care","Pushing / grabbing","Striking out","Kicking","Throwing objects","Property damage","Self-injury","Disinhibition","Other"];
var triggers=["Personal care","Medication due","Medication recently given","Pain / discomfort","Noise / overstimulation","Fatigue","Poor sleep","Hunger / thirst","Bowel / bladder discomfort","Change of routine","Transition / waiting","Unfamiliar person","Demand / request","Conflict / interaction","Unknown"];
var interventions=["Quiet space","Reassurance","Validation","Distraction / redirection","Reduced demands","Change of staff approach","Snack / drink","Pain relief as prescribed","PRN medication as prescribed","Sensory reduction","Preferred activity","Time alone / space","No intervention"];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function active(){return state.people.find(function(p){return p&&p.id===state.active;})||state.people[0]||{id:"p1",name:"Person 1"};}
function mine(){return state.logs.filter(function(x){return x.person===state.active;});}
function medMine(){return state.medLogs.filter(function(x){return x.person===state.active;});}
function renderTabs(){
  var el=document.getElementById("tabs");
  el.innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(current===t[0]?"on":"")+'">'+t[1]+'</button>';}).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){b.onclick=function(){current=b.getAttribute("data-tab");render();};});
}
function card(text){return '<div class="card">'+text+'</div>';}
function chips(name,items){
  return '<div class="row chips" data-name="'+name+'">'+items.map(function(x){return '<button type="button" class="chip" data-v="'+esc(x)+'">'+esc(x)+'</button>';}).join("")+'</div>';
}
function insightList(){
  var l=mine(), out=[];
  if(l.length<2)return out;
  var hourScore={};
  l.forEach(function(x){var h=new Date(x.ts).getHours();hourScore[h]=(hourScore[h]||0)+Number(x.level||0);});
  var peak=Object.keys(hourScore).sort(function(a,b){return hourScore[b]-hourScore[a];})[0];
  if(peak!=null)out.push("Recorded behaviour intensity is currently highest around "+String(peak).padStart(2,"0")+":00.");
  var c={};
  l.forEach(function(x){(x.triggers||[]).forEach(function(t){c[t]=(c[t]||0)+1;});});
  var top=Object.keys(c).sort(function(a,b){return c[b]-c[a];})[0];
  if(top)out.push("“"+top+"” is the most frequently recorded possible factor ("+c[top]+" records).");
  var severe=l.filter(function(x){return Number(x.level)>=3;});
  if(severe.length){
    var poor=severe.filter(function(x){return x.sleep==="Poor"||x.sleep==="Interrupted";}).length;
    out.push(poor+" of "+severe.length+" high-intensity records followed poor or interrupted sleep.");
  }
  return out;
}
function homeView(){
  var today=new Date().toISOString().slice(0,10), tl=mine().filter(function(x){return x.date===today;});
  var ins=insightList();
  return '<div class="p">Active profile: <b>'+esc(active().name)+'</b></div>'+
    '<h1 class="h1">How are they right now?</h1>'+
    '<div class="p">Record routine observations or incidents and compare them with medication, sleep, pain and possible antecedents.</div>'+
    '<button class="btn primary" data-go="log">+ Log behaviour / mood</button>'+
    '<button class="btn secondary" data-go="meds">+ Log medication</button>'+
    '<div class="stats"><div class="card stat"><div class="big">'+tl.length+'</div><div class="muted">entries today</div></div>'+
    '<div class="card stat"><div class="big">'+tl.filter(function(x){return Number(x.level)>=3;}).length+'</div><div class="muted">high intensity</div></div>'+
    '<div class="card stat"><div class="big">'+medMine().filter(function(x){return x.date===today;}).length+'</div><div class="muted">med logs</div></div></div>'+
    card('<b>Pattern watch</b><div class="p">'+esc(ins[0]||"More observations are needed before a useful pattern can be identified.")+'</div>')+
    '<div class="card notice"><b>Observation, not diagnosis</b><div class="p">Timing and behaviour summaries are associations only. NeuroPattern does not prove medication causation and does not recommend medication changes.</div></div>';
}
function logView(){
  return '<h1 class="h1">New behaviour record</h1><form id="logForm">'+
  '<div class="field"><div class="label">Entry type</div><select name="type"><option>Observation</option><option>Incident</option></select></div>'+
  '<div class="field"><div class="label">Intensity</div><select name="level"><option value="0">0 — Calm</option><option value="1">1 — Unsettled</option><option value="2">2 — Agitated</option><option value="3">3 — Highly agitated</option><option value="4">4 — Aggressive</option></select></div>'+
  '<div class="field"><div class="label">Behaviour</div>'+chips("behaviours",behaviours)+'</div>'+
  '<div class="field"><div class="label">Possible factors immediately before</div>'+chips("triggers",triggers)+'</div>'+
  '<div class="field"><div class="label">Antecedent</div><textarea name="antecedent" placeholder="What happened immediately before?"></textarea></div>'+
  '<div class="field"><div class="label">Consequence</div><textarea name="consequence" placeholder="What happened immediately after?"></textarea></div>'+
  '<div class="field"><div class="label">Pain 0–10</div><input class="inp" type="number" min="0" max="10" name="pain" value="0"></div>'+
  '<div class="field"><div class="label">Sleep</div><select name="sleep"><option>Unknown</option><option>Good</option><option>Interrupted</option><option>Poor</option></select></div>'+
  '<div class="field"><div class="label">Intervention used</div>'+chips("interventions",interventions)+'</div>'+
  '<div class="field"><div class="label">Outcome</div><select name="outcome"><option>Not known</option><option>Much calmer</option><option>Somewhat calmer</option><option>No change</option><option>More agitated</option></select></div>'+
  '<div class="field"><label><input type="checkbox" name="injury"> Injury occurred</label><br><label><input type="checkbox" name="damage"> Property damage</label></div>'+
  '<div class="field"><div class="label">Notes</div><textarea name="notes"></textarea></div>'+
  '<button class="btn primary">Save record</button></form>';
}
function timelineView(){
  var ev=mine().map(function(x){var y=Object.assign({},x);y.kind="beh";return y;})
    .concat(medMine().map(function(x){var y=Object.assign({},x);y.kind="med";return y;}))
    .sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
  if(!ev.length)return '<h1 class="h1">Timeline</h1>'+card("No entries yet.");
  return '<h1 class="h1">Timeline</h1>'+ev.slice(0,100).map(function(x){
    if(x.kind==="med")return '<div class="card event"><b>'+new Date(x.ts).toLocaleString()+' • Medication</b><div>'+esc(x.name)+' '+esc(x.dose||"")+'</div><div class="muted">'+esc(x.type||"Regular")+'</div></div>';
    return '<div class="card event '+(Number(x.level)>=3?"danger":"")+'"><b>'+new Date(x.ts).toLocaleString()+' • '+esc(x.type)+'</b><div>Intensity '+esc(x.level)+'/4 • '+esc((x.behaviours||[]).join(", ")||"No behaviour selected")+'</div><div class="muted">Before: '+esc((x.triggers||[]).join(", ")||"not recorded")+'</div></div>';
  }).join("");
}
function patternsView(){
  var ins=insightList(), hours=new Array(24).fill(0), counts={};
  mine().forEach(function(x){hours[new Date(x.ts).getHours()]+=Number(x.level||0);(x.triggers||[]).forEach(function(t){counts[t]=(counts[t]||0)+1;});});
  var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,8);
  var html='<h1 class="h1">Patterns</h1><div class="card notice"><b>Association only</b><div class="p">These summaries support review; they do not identify a medical cause.</div></div>';
  if(!ins.length)html+=card("Add more observations to generate pattern summaries.");
  ins.forEach(function(x,i){html+=card("<b>Pattern observation "+(i+1)+"</b><div class='p'>"+esc(x)+"</div>");});
  html+='<div class="field"><div class="label">24-hour intensity heatmap</div><div class="heat">'+hours.map(function(v,i){return '<div>'+String(i).padStart(2,"0")+'<br><b>'+v+'</b></div>';}).join("")+'</div></div>';
  html+='<div class="field"><div class="label">Most recorded possible factors</div>';
  if(!top.length)html+=card("No factor data yet.");
  top.forEach(function(k){html+=card('<div class="profile"><span>'+esc(k)+'</span><b>'+counts[k]+'</b></div>');});
  return html+'</div>';
}
function medsView(){
  var list=state.meds.filter(function(m){return m.person===state.active;});
  var html='<h1 class="h1">Medication</h1><div class="p">Record actual administration times. Regular and PRN administrations are kept separate.</div>';
  list.forEach(function(m){html+='<div class="card profile"><div><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.dose||"")+' • '+esc(m.schedule||"PRN")+'</div></div><div><button class="chip give" data-id="'+esc(m.id)+'" data-type="Regular">Given</button> <button class="chip give" data-id="'+esc(m.id)+'" data-type="PRN">PRN</button></div></div>';});
  html+='<form id="medForm"><div class="field"><div class="label">Add medication</div><input class="inp" name="name" placeholder="Medication name" required></div><input class="inp" name="dose" placeholder="Dose (optional)"><input class="inp" name="schedule" placeholder="Scheduled time e.g. 20:00"><button class="btn secondary">Add medication</button></form>';
  return html;
}
function peopleView(){
  var html='<h1 class="h1">People / service users</h1><div class="p">Each profile has separate records on this device.</div>';
  state.people.forEach(function(p){html+='<div class="card profile"><div><b>'+esc(p.name)+'</b><div class="muted">'+state.logs.filter(function(x){return x.person===p.id;}).length+' behaviour records</div></div><button class="chip selectPerson '+(p.id===state.active?"on":"")+'" data-id="'+esc(p.id)+'">'+(p.id===state.active?"Active":"Select")+'</button></div>';});
  html+='<form id="personForm"><div class="field"><div class="label">Add person</div><input class="inp" name="name" placeholder="Preferred name / identifier" required></div><textarea name="notes" placeholder="Baseline / communication notes"></textarea><button class="btn secondary">Add person</button></form>';
  return html;
}
function reportsView(){
  var html='<h1 class="h1">Reports & handover</h1><div class="card"><b>Data export</b><div class="p">Export the active person’s behaviour log as CSV or create a local JSON backup.</div><button class="btn secondary" id="csvBtn">Export behaviour CSV</button><button class="btn secondary" id="jsonBtn">Export full backup JSON</button></div>';
  html+='<form id="handoverForm"><div class="field"><div class="label">Shift handover note</div><textarea name="note" required placeholder="Concise factual handover note"></textarea></div><button class="btn primary">Save handover</button></form>';
  state.handovers.filter(function(h){return h.person===state.active;}).slice().reverse().slice(0,8).forEach(function(h){html+=card('<div class="muted">'+new Date(h.ts).toLocaleString()+'</div><div>'+esc(h.note)+'</div>');});
  return html;
}
function render(){
  try{
    renderTabs();
    var views={home:homeView,log:logView,timeline:timelineView,patterns:patternsView,meds:medsView,people:peopleView,reports:reportsView};
    document.getElementById("app").innerHTML='<div class="page">'+views[current]()+'</div>';
    bind();
  }catch(err){
    console.error(err);
    document.getElementById("tabs").innerHTML="";
    document.getElementById("app").innerHTML='<div class="page"><h1 class="h1">NeuroPattern</h1><div class="card danger"><b>Dashboard recovery</b><div class="p">The dashboard hit a local data error. Resetting only clears NeuroPattern data stored in this app.</div><button class="btn primary" id="resetBtn">Reset local app data</button></div></div>';
    var rb=document.getElementById("resetBtn"); if(rb)rb.onclick=resetData;
  }
}
function selected(name){return Array.prototype.map.call(document.querySelectorAll('.chips[data-name="'+name+'"] .chip.on'),function(x){return x.getAttribute("data-v");});}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){current=b.getAttribute("data-go");render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".chips .chip"),function(b){b.onclick=function(){b.classList.toggle("on");};});
  Array.prototype.forEach.call(document.querySelectorAll(".selectPerson"),function(b){b.onclick=function(){state.active=b.getAttribute("data-id");save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".give"),function(b){b.onclick=function(){var id=b.getAttribute("data-id"),m=state.meds.find(function(x){return x.id===id;}),d=new Date();if(!m)return;state.medLogs.push({id:String(Date.now()),person:state.active,medId:id,name:m.name,dose:m.dose,type:b.getAttribute("data-type"),ts:d.toISOString(),date:d.toISOString().slice(0,10)});save();render();};});
  var f=document.getElementById("logForm");
  if(f)f.onsubmit=function(e){e.preventDefault();var fd=new FormData(f),now=new Date();state.logs.push({id:String(Date.now()),person:state.active,ts:now.toISOString(),date:now.toISOString().slice(0,10),type:fd.get("type"),level:Number(fd.get("level")),behaviours:selected("behaviours"),triggers:selected("triggers"),interventions:selected("interventions"),antecedent:fd.get("antecedent"),consequence:fd.get("consequence"),pain:Number(fd.get("pain")),sleep:fd.get("sleep"),outcome:fd.get("outcome"),injury:fd.get("injury")==="on",damage:fd.get("damage")==="on",notes:fd.get("notes")});save();current="timeline";render();};
  var mf=document.getElementById("medForm");
  if(mf)mf.onsubmit=function(e){e.preventDefault();var fd=new FormData(mf);state.meds.push({id:String(Date.now()),person:state.active,name:fd.get("name"),dose:fd.get("dose"),schedule:fd.get("schedule")});save();render();};
  var pf=document.getElementById("personForm");
  if(pf)pf.onsubmit=function(e){e.preventDefault();var fd=new FormData(pf),id="p"+Date.now();state.people.push({id:id,name:fd.get("name"),notes:fd.get("notes")});state.active=id;save();render();};
  var hf=document.getElementById("handoverForm");
  if(hf)hf.onsubmit=function(e){e.preventDefault();var fd=new FormData(hf);state.handovers.push({id:String(Date.now()),person:state.active,ts:new Date().toISOString(),note:fd.get("note")});save();render();};
  var jb=document.getElementById("jsonBtn");if(jb)jb.onclick=exportJSON;
  var cb=document.getElementById("csvBtn");if(cb)cb.onclick=exportCSV;
}
function download(name,text,type){var blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
function exportJSON(){download("NeuroPattern-backup.json",JSON.stringify(state,null,2),"application/json");}
function exportCSV(){
  var rows=[["timestamp","type","level","behaviours","possible_factors","antecedent","consequence","pain","sleep","interventions","outcome","injury","property_damage","notes"]];
  mine().forEach(function(x){rows.push([x.ts,x.type,x.level,(x.behaviours||[]).join("; "),(x.triggers||[]).join("; "),x.antecedent,x.consequence,x.pain,x.sleep,(x.interventions||[]).join("; "),x.outcome,x.injury,x.damage,x.notes]);});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download("NeuroPattern-behaviour.csv",csv,"text/csv");
}
function resetData(){try{["neuropattern-v3","neuropattern-v4","neuropattern-v5"].forEach(function(k){localStorage.removeItem(k);});}catch(e){}location.reload();}
document.getElementById("quickAdd").onclick=function(){current="log";render();};
render();
})();
</script>
</body>
</html>
