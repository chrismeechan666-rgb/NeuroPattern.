<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NeuroPattern</title>
<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --bg:#f3f7f7;--card:#fff;--ink:#173f44;--muted:#6d8387;--line:#dce7e8;
  --teal:#176b68;--teal2:#dcefeb;--red:#a84444;--amber:#a66b14;--green:#2c7a56;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
.top{background:var(--card);padding:17px 18px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:27px;font-weight:900;letter-spacing:-.6px}.tag{font-size:12px;color:var(--muted);margin-top:2px}
.activeBadge{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--teal2);color:var(--teal);font-weight:800;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:9}
.tabs button{border:0;background:var(--card);padding:12px 13px;color:var(--muted);white-space:nowrap;font-weight:700}
.tabs button.on{color:var(--teal);border-bottom:3px solid var(--teal)}
.page{padding:17px 17px 92px}.h1{font-size:24px;font-weight:900;margin:0 0 6px}.h2{font-size:16px;font-weight:850;margin:18px 0 7px}
.p{font-size:14px;line-height:1.48;color:#4f666a}.muted{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:11px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.notice{background:#eef5f5}.danger{border-left:4px solid var(--red)}.warn{border-left:4px solid var(--amber)}.good{border-left:4px solid var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:13px}.big{font-size:23px;font-weight:900}.small{font-size:11px;color:var(--muted)}
.btn{width:100%;padding:13px 14px;border-radius:13px;border:0;font-weight:850;margin-top:9px;font-size:14px}
.primary{background:var(--teal);color:white}.secondary{background:white;color:var(--teal);border:1px solid #c9dada}.dangerBtn{background:#fff;color:var(--red);border:1px solid #e4caca}
.quickState{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.quickState button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:11px;color:var(--ink);font-weight:750}
.quickState button b{display:block;font-size:19px;margin-bottom:2px}.quickState button[data-level="4"]{border-color:#e2bcbc}
.field{margin-top:13px}.label{font-size:13px;font-weight:850;margin-bottom:7px}
.inp,select,textarea{width:100%;padding:11px;border:1px solid #d4e0e1;border-radius:11px;background:#fff;color:var(--ink);font:inherit}
textarea{min-height:78px;resize:vertical}.row{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 10px;border-radius:999px;border:1px solid #cbdadb;background:#fff;color:#50666a;font-size:12px}
.chip.on{background:var(--teal2);border-color:var(--teal);color:#155b58;font-weight:850}
.event{position:relative;padding-left:16px}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal);border-radius:4px}
.event.red:before{background:var(--red)}.event.amber:before{background:var(--amber)}
.eventHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eventTitle{font-weight:850}
.profile{display:flex;justify-content:space-between;gap:10px;align-items:center}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.heatCell{padding:8px 3px;border-radius:8px;background:#e4eeee;text-align:center;font-size:10px}
.heatCell b{font-size:13px}.barrow{display:grid;grid-template-columns:1.4fr 3fr 32px;gap:7px;align-items:center;margin:7px 0;font-size:12px}.bar{height:9px;background:#e5eeee;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}
.navadd{position:fixed;right:17px;bottom:17px;width:58px;height:58px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:31px;box-shadow:0 6px 18px #0003;z-index:20}
.sep{height:1px;background:var(--line);margin:12px 0}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#edf3f3;color:#5b7276;display:inline-block}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}.right{text-align:right}
.range{display:flex;gap:7px;margin:10px 0 2px}.range button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 5px;font-weight:800;color:var(--muted)}.range button.on{background:var(--teal2);border-color:var(--teal);color:var(--teal)}
.chart{height:190px;display:flex;align-items:flex-end;gap:4px;padding:10px 4px 25px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.col{flex:1;min-width:5px;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}.col span{display:block;width:80%;min-height:2px;background:var(--teal);border-radius:5px 5px 1px 1px}.col i{position:absolute;bottom:-20px;font-style:normal;font-size:9px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--teal);margin-right:4px}.dot.med{background:var(--amber)}.dot.high{background:var(--red)}
.timelineChart{position:relative;height:150px;border:1px solid var(--line);border-radius:12px;background:#fbfdfd;margin-top:10px;overflow:hidden}.axisline{position:absolute;left:0;right:0;height:1px;background:#e7eeee}.eventdot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,50%);background:var(--teal)}.eventdot.high{background:var(--red);width:13px;height:13px}.medmark{position:absolute;top:8px;bottom:8px;width:2px;background:var(--amber);opacity:.75}.axislabel{position:absolute;bottom:2px;font-size:9px;color:var(--muted);transform:translateX(-50%)}
.insightStrong{font-weight:850;color:var(--ink)}.score{display:inline-block;border-radius:999px;background:var(--teal2);color:var(--teal);font-weight:900;padding:4px 8px;font-size:11px}

@media(max-width:420px){.brand{font-size:25px}.tabs{top:74px}.page{padding-left:14px;padding-right:14px}.quickState{gap:4px}.quickState button{font-size:10px;padding:8px 2px}}

/* === V13.1 Log workflow polish === */
.logIntro{margin:8px 0 14px}.logIntro h1{margin-bottom:4px}.logIntro p{margin:0;color:var(--muted)}
#logForm{display:grid;gap:12px;padding-bottom:118px}
#logForm .formSection{margin:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 18px rgba(23,63,68,.035)}
#logForm .formSectionHead{margin-bottom:11px;gap:10px}
#logForm .formSectionHead h3{font-size:17px;line-height:1.2;margin:0;color:var(--ink)}
#logForm .formSectionHead p{font-size:13px;line-height:1.35;margin:4px 0 0;color:var(--muted)}
#logForm .choiceGrid{gap:8px}
#logForm .choiceCard{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:850;transition:.16s ease}
#logForm .choiceCard.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 5px 14px rgba(23,107,104,.18)}
#logForm .intensityGrid{gap:7px}
#logForm .intensityCard{min-width:0;border-radius:16px;padding:11px 5px 9px;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
#logForm .intensityCard:active{transform:scale(.97)}
#logForm .intensityCard .face{font-size:20px}
#logForm .intensityCard b{font-size:16px}
#logForm .intensityCard small{font-size:10px}
#logForm .logPills{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;padding:2px 1px 7px;scrollbar-width:none}
#logForm .logPills::-webkit-scrollbar{display:none}
#logForm .logPills label,#logForm .logPills .chip{flex:0 0 auto}
#logForm textarea.logTextarea{min-height:88px;border-radius:14px;resize:vertical}
#logForm select,#logForm .inp{border-radius:14px;min-height:48px}
#logForm .clearMini{border:0;background:var(--teal2);color:var(--teal);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;white-space:nowrap}
#logForm .factorGrid{gap:8px}
#logForm .factorCheck{border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:11px}
#logForm .reviewBox{border:1px solid rgba(23,107,104,.24);background:var(--teal2);border-radius:18px;padding:14px 16px}
#logForm .reviewBox b{display:block;color:var(--teal);margin-bottom:3px}
#logForm .saveBar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.13)}
#logForm .primarySave{min-height:56px;border-radius:17px;font-size:17px}
.logStepBar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0 5px}
.logStepBar::-webkit-scrollbar{display:none}
.logStep{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850}
.logStep.active{background:var(--teal);border-color:var(--teal);color:#fff}
.logStep{font-family:inherit;cursor:pointer;white-space:nowrap}
.logStepAnchor{height:1px;scroll-margin-top:150px}
.logTip{display:flex;gap:10px;align-items:flex-start;background:var(--teal2);border:1px solid rgba(23,107,104,.18);border-radius:16px;padding:11px 13px;margin-bottom:12px;color:var(--ink);font-size:13px;line-height:1.35}
.logTip b{color:var(--teal)}
body.dark #logForm .formSection,body.dark .logStep{background:var(--card)}
body.dark #logForm .choiceCard,body.dark #logForm .factorCheck{background:#183034}
body.dark #logForm .reviewBox,body.dark .logTip{background:#173b3a}
body.dark #logForm .saveBar{background:rgba(15,29,32,.90)}
@media(max-width:520px){
  #logForm .formSection{padding:14px;border-radius:18px}
  #logForm .grid2{grid-template-columns:1fr}
  #logForm .intensityGrid{gap:5px}
  #logForm .intensityCard{padding:10px 3px 8px}
  #logForm .intensityCard small{font-size:9px}
}

</style>

<style id="v8-polish">
:root{--calm:#2e8b72;--unsettled:#c7a32a;--agitated:#df7b2d;--high:#d94b45;--aggressive:#9f2f3d;--surface:#fff;--surface2:#f5f8f8}
body.dark{--ink:#f2f6f6;--muted:#aab8b8;--line:#334343;--surface:#172020;--surface2:#101717;--teal2:#193a36;background:#101717;color:var(--ink)}
body.dark .card,body.dark input,body.dark textarea,body.dark select,body.dark .range button,body.dark .timelineChart{background:var(--surface);color:var(--ink);border-color:var(--line)}
body.dark .range button.on{background:var(--teal2)}
.v8top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.personBadge{display:inline-flex;align-items:center;gap:6px;background:var(--teal2);color:var(--teal);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;min-height:44px;font-size:19px}
.statusGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.statusGrid button{border:0;border-radius:15px;min-height:70px;padding:10px;color:white;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.08)}.statusGrid button:last-child{grid-column:1/-1}.statusGrid b{display:block;font-size:17px}.statusGrid small{opacity:.9}.s0{background:var(--calm)}.s1{background:var(--unsettled)}.s2{background:var(--agitated)}.s3{background:var(--high)}.s4{background:var(--aggressive)}
.quickActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.quickActions button{min-height:50px;border:1px solid var(--line);border-radius:13px;background:var(--surface);font-weight:850;color:var(--ink)}

.timelineLevel{display:inline-block;border-radius:999px;padding:3px 7px;color:#fff;font-size:10px;font-weight:900}.tl0{background:var(--calm)}.tl1{background:var(--unsettled)}.tl2{background:var(--agitated)}.tl3{background:var(--high)}.tl4{background:var(--aggressive)}
.stickyQuick{position:sticky;bottom:8px;z-index:8;display:flex;gap:8px;margin-top:14px;padding:7px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}.stickyQuick button{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:900}.primary{background:var(--teal);color:#fff}.secondary{background:var(--surface2);color:var(--ink)}
.medType{font-size:10px;font-weight:900;border-radius:999px;padding:3px 7px;background:var(--teal2);color:var(--teal)}.lastGiven{font-size:11px;color:var(--muted);margin-top:4px}
.undoToast{position:fixed;left:12px;right:12px;bottom:76px;z-index:99;background:#172020;color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,.25)}.undoToast button{border:0;border-radius:9px;padding:7px 10px;font-weight:900}
@media(min-width:600px){.statusGrid{grid-template-columns:repeat(5,1fr)}.statusGrid button:last-child{grid-column:auto}}
</style>


<style id="v9-professional">
.staffbar{display:flex;gap:8px;align-items:center;margin:8px 0 12px}.staffbar input{max-width:120px}.auditrow{border-left:3px solid var(--line);padding:8px 10px;margin:7px 0;background:var(--surface);border-radius:0 10px 10px 0}.auditrow b{font-size:12px}.auditrow .muted{font-size:10px}.releaseBanner{border:1px solid #d7b15d;background:#fff8df;border-radius:14px;padding:12px;margin:10px 0;color:#5e4a12}.dark .releaseBanner{background:#2b2818;color:#f3dda2;border-color:#6f6030}.reportGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.reportGrid .card{text-align:center}.reportGrid .big{font-size:25px;font-weight:900}.tiny{font-size:10px;color:var(--muted)}.prnFollow{border:1px dashed var(--amber);border-radius:12px;padding:10px;margin-top:8px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:800}.seg button.on{background:var(--teal2);color:var(--teal);border-color:var(--teal)}.warnText{font-size:11px;line-height:1.45;color:var(--muted)}
</style>


<style id="v10-release">
.brandSplash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px 18px}
.brandMark{width:82px;height:82px;border-radius:24px;background:linear-gradient(145deg,var(--teal),#2f7068);display:grid;place-items:center;color:#fff;font-size:38px;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.15)}
.brandName{font-size:30px;font-weight:950;letter-spacing:-.03em;margin-top:14px}.brandTag{color:var(--muted);margin-top:4px}
.onboardStep{margin:14px 0}.onboardStep h3{margin:0 0 5px;font-size:17px}.onboardStep p{margin:0;color:var(--muted);line-height:1.45}
.releasePill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--teal2);color:var(--teal);font-size:11px;font-weight:900;padding:5px 9px}
.settingsGroup{margin:14px 0}.settingsGroup h3{font-size:15px;margin:0 0 8px}.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.settingsRow:last-child{border-bottom:0}.settingsRow .copy{flex:1}.settingsRow .copy b{display:block;font-size:13px}.settingsRow .copy small{display:block;color:var(--muted);margin-top:2px}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:#aeb9b9;border:0}.switch.on{background:var(--teal)}.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.switch.on:after{left:23px}
.lockScreen{position:fixed;inset:0;z-index:9999;background:var(--surface2);display:flex;align-items:center;justify-content:center;padding:20px}.lockCard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 40px rgba(0,0,0,.18);text-align:center}.pinDots{font-size:28px;letter-spacing:8px;margin:8px 0 14px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{min-height:56px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);font-size:20px;font-weight:900;color:var(--ink)}
.demoBanner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#eef4ff;border:1px solid #bfd0f0;color:#26466d;border-radius:14px;padding:10px 12px;margin:8px 0}.dark .demoBanner{background:#182639;color:#cfe0ff;border-color:#395574}
.dangerZone{border:1px solid #e4b0b0;background:#fff4f4;border-radius:14px;padding:12px;margin-top:12px}.dark .dangerZone{background:#2f1b1b;border-color:#6b3434}.dangerBtn{background:#b73737;color:#fff;border:0;border-radius:12px;padding:11px 13px;font-weight:900}
.aboutGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.aboutGrid .card{text-align:center}.aboutGrid b{display:block;font-size:18px}
.firstRunOverlay{position:fixed;inset:0;z-index:10000;background:var(--surface2);overflow:auto;padding:18px}.firstRunWrap{max-width:560px;margin:0 auto}
.noticeStrong{font-weight:850;line-height:1.45}
</style>


<style id="v11-staff-tracking">
.page{animation:pageIn .18s ease both}
@keyframes pageIn{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
.v11Splash{position:fixed;inset:0;z-index:12000;background:linear-gradient(160deg,#08191c,#0d3237 55%,#0f4d52);display:grid;place-items:center;color:#fff;transition:opacity .35s ease,visibility .35s ease}
.v11Splash.out{opacity:0;visibility:hidden}.neuroAnim{position:relative;width:180px;height:180px}.neuroCore{position:absolute;inset:48px;border:2px solid #89e1d7;border-radius:32px;display:grid;place-items:center;font-size:48px;font-weight:950;box-shadow:0 0 35px #38b8aa55;animation:corePulse 1.2s ease-in-out infinite}.node{position:absolute;width:13px;height:13px;border-radius:50%;background:#8ce8dd;box-shadow:0 0 13px #6ce6d7}.node:after{content:"";position:absolute;height:2px;width:60px;background:linear-gradient(90deg,#8ce8dd99,transparent);transform-origin:left center}.n1{left:14px;top:30px}.n1:after{transform:rotate(28deg)}.n2{right:11px;top:27px}.n2:after{transform:rotate(150deg)}.n3{left:4px;bottom:42px}.n3:after{transform:rotate(-22deg)}.n4{right:3px;bottom:37px}.n4:after{transform:rotate(202deg)}.n5{left:82px;top:2px}.n5:after{transform:rotate(88deg);width:45px}.n6{left:84px;bottom:0}.n6:after{transform:rotate(-90deg);width:43px}.node{animation:nodePulse 1.15s ease-in-out infinite}.n2,.n4,.n6{animation-delay:.28s}
.splashWords{text-align:center;margin-top:14px}.splashWords b{display:block;font-size:27px;letter-spacing:-.04em}.splashWords span{font-size:11px;opacity:.78;letter-spacing:.08em;text-transform:uppercase}

  if(sev.length)pieces.push("Latest high-intensity record: "+new Date(sev[sev.length-1].ts).toLocaleString());
  var i=insights(7);if(i.length)pieces.push("7-day pattern: "+i[0]);
  return pieces.join(". ")+".";
}

function hashPin(v){
  // Lightweight local hash for convenience lock only; not cryptographic security.
  var h=2166136261;
  for(var i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619);}
  return String(h>>>0);
}

  var form=document.querySelector('form');
  if(!form) return null;
  var obj={savedAt:Date.now(),path:(location.hash||''),fields:{}};
  form.querySelectorAll('input,select,textarea').forEach(function(el){
    if(!el.name && !el.id) return;
    var k=el.name||el.id;
    if(el.type==='password'||el.type==='file') return;
    obj.fields[k]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value;
  });
  return obj;
}
document.addEventListener('input',function(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(function(){
    try{var d=collectDraft(); if(d) sessionStorage.setItem('np-v13-form-draft',JSON.stringify(d));}catch(e){}
  },500);
});
document.addEventListener('change',function(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(function(){
    try{var d=collectDraft(); if(d) sessionStorage.setItem('np-v13-form-draft',JSON.stringify(d));}catch(e){}
  },300);
});

/* Clear temporary draft after obvious save actions. */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button,.btn');
  if(!b)return;
  var t=(b.textContent||'').trim().toLowerCase();
  if(t==='save'||t.indexOf('save ')===0||t.indexOf('record medication')>=0){
    setTimeout(function(){try{sessionStorage.removeItem('np-v13-form-draft')}catch(e){}},800);
  }
});

/* Warn only when a form appears to contain unsaved typed content. */
window.addEventListener('beforeunload',function(e){
  var d=null; try{d=sessionStorage.getItem('np-v13-form-draft')}catch(x){}
  if(!d)return;
  e.preventDefault(); e.returnValue='';
});

/* Keyboard escape closes visible record menu without changing data. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var m=document.querySelector('.recordMenu');
  if(m && getComputedStyle(m).display!=='none'){
    var q=document.querySelector('.quickRecord'); if(q) q.click();
  }
});

/* Keep selected timeline filter visible and announce selection. */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-tfilter]');
  if(!b)return;
  setTimeout(function(){
    document.querySelectorAll('.timelineFilters [data-tfilter]').forEach(function(x){x.setAttribute('aria-pressed',x.classList.contains('on')?'true':'false')});
    var a=document.querySelector('.timelineFilters .on'); if(a&&a.scrollIntoView)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  },30);
});

/* Lightweight integrity marker for troubleshooting/version support. */
try{localStorage.setItem('neuropattern-app-version',NP_VERSION)}catch(e){}
})();
</script>
