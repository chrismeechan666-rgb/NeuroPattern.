<style>

.event{position:relative;padding-left:16px}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal);border-radius:4px}

.eventHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eventTitle{font-weight:850}

.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.heatCell{padding:8px 3px;border-radius:8px;background:#e4eeee;text-align:center;font-size:10px}

<style id="v11-staff-tracking">
.page{animation:pageIn .18s ease both}

.v11Splash.out{opacity:0;visibility:hidden}.neuroAnim{position:relative;width:180px;height:180px}.neuroCore{position:absolute;inset:48px;border:2px solid #89e1d7;border-radius:32px;display:grid;place-items:center;font-size:48px;font-weight:950;box-shadow:0 0 35px #38b8aa55;animation:corePulse 1.2s ease-in-out infinite}.node{position:absolute;width:13px;height:13px;border-radius:50%;background:#8ce8dd;box-shadow:0 0 13px #6ce6d7}.node:after{content:"";position:absolute;height:2px;width:60px;background:linear-gradient(90deg,#8ce8dd99,transparent);transform-origin:left center}.n1{left:14px;top:30px}.n1:after{transform:rotate(28deg)}.n2{right:11px;top:27px}.n2:after{transform:rotate(150deg)}.n3{left:4px;bottom:42px}.n3:after{transform:rotate(-22deg)}.n4{right:3px;bottom:37px}.n4:after{transform:rotate(202deg)}.n5{left:82px;top:2px}.n5:after{transform:rotate(88deg);width:45px}.n6{left:84px;bottom:0}.n6:after{transform:rotate(-90deg);width:43px}.node{animation:nodePulse 1.15s ease-in-out infinite}.n2,.n4,.n6{animation-delay:.28s}

<body>
<div id="v11Splash" class="v11Splash"><div><div class="neuroAnim"><div class="node n1"></div><div class="node n2"></div><div class="node n3"></div><div class="node n4"></div><div class="node n5"></div><div class="node n6"></div><div class="neuroCore">N</div></div><div class="splashWords"><b>NeuroPattern</b><span>connecting the record</span></div></div></div>
<header class="top"><div class="brandrow"><div><div class="brand">NeuroPattern</div><div class="tag">ABI behaviour • medication • pattern tracker</div></div><div id="activeBadge" class="activeBadge">Person 1</div></div></header>

<main id="app"></main>
<div class="fabLabel">Quick log</div><button id="quickAdd" class="navadd">+</button>
<script>
(function(){
"use strict";
var KEY="neuropattern-v6";
var APP_VERSION="11.3";
var OLD_KEYS=["neuropattern-v5","neuropattern-v4","neuropattern-v3"];
var defaults={people:[{id:"p1",name:"Person 1",baseline:"",communication:"",riskNotes:""}],active:"p1",logs:[],meds:[],medLogs:[],handovers:[],settings:{showSafety:true}};
function clone(x){return JSON.parse(JSON.stringify(x));}
function loadState(){
  var d=null, raw=null;
  try{
    raw=localStorage.getItem(KEY);
    if(!raw){for(var i=0;i<OLD_KEYS.length&&!raw;i++)raw=localStorage.getItem(OLD_KEYS[i]);}
    if(raw)d=JSON.parse(raw);
  }catch(e){d=null;}
  if(!d||typeof d!=="object")d=clone(defaults);

function handoverSummary(){
  var cutoff=Date.now()-12*3600000,l=mine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;}),m=medsMine().filter(function(x){return new Date(x.ts).getTime()>=cutoff;}),sev=l.filter(function(x){return Number(x.level)>=3;});
  var pieces=["Last 12h: "+l.length+" behaviour/mood records",sev.length+" high-intensity",m.length+" medication administrations"];
  if(sev.length)pieces.push("Latest high-intensity record: "+new Date(sev[sev.length-1].ts).toLocaleString());
  var i=insights(7);if(i.length)pieces.push("7-day pattern: "+i[0]);
  return pieces.join(". ")+".";
}

function createStaffUser(name,initials,pin,role){
  name=(name||"").trim();initials=(initials||"").trim().toUpperCase().slice(0,8);role=role||"Staff";
  if(!name||!initials||!/^\d{4,6}$/.test(pin||""))return false;
  var u={id:"u"+Date.now()+Math.random(),name:name,initials:initials,role:role,pinHash:hashPin(pin),active:true,created:new Date().toISOString()};
  state.users.push(u);state.sessionUserId=u.id;state.settings.staffInitials=initials;audit("CREATE_USER",name+" • "+role);save();return true;
}

function hashPin(v){
  // Lightweight local hash for convenience lock only; not cryptographic security.
  var h=2166136261;
  for(var i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619);}
  return String(h>>>0);
}
function touchActivity(){if(state&&state.settings){state.settings.lastActive=Date.now();}}
function shouldAutoLock(){
  if(!state.settings.pinEnabled)return false;
  var mins=Number(state.settings.autoLockMinutes||5);
  return Date.now()-Number(state.settings.lastActive||0) > mins*60000;
}
function setPin(pin){
  if(!/^\d{4,6}$/.test(pin||"")){alert("Use a 4–6 digit PIN.");return false;}
  state.settings.pinHash=hashPin(pin);state.settings.pinEnabled=true;state.settings.lastActive=Date.now();save();return true;
}
function disablePin(){state.settings.pinEnabled=false;state.settings.pinHash="";save();render();}
function lockNow(){if(state.settings.pinEnabled){state.settings.lastActive=0;save();showLockScreen();}}
function showLockScreen(){
  if(!state.settings.pinEnabled)return;
  var old=document.getElementById("npLock");if(old)old.remove();
  var entered="";
  var d=document.createElement("div");d.id="npLock";d.className="lockScreen";
  d.innerHTML='<div class="lockCard"><div class="brandMark" style="margin:auto">N</div><h2>NeuroPattern locked</h2><div class="p">Enter your app PIN</div><div class="pinDots" id="pinDots">○ ○ ○ ○</div><div class="keypad">'+
  [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-key="'+n+'">'+n+'</button>';}).join("")+
  '<button data-key="clear">⌫</button><button data-key="0">0</button><button data-key="ok">✓</button></div><div class="p tiny">This PIN is a convenience lock for the local prototype. It is not a substitute for device encryption, secure authentication or organisational access controls.</div></div>';
  document.body.appendChild(d);
  function draw(){document.getElementById("pinDots").textContent=(entered?"● ".repeat(entered.length):"")+"○ ".repeat(Math.max(0,4-entered.length));}
  d.querySelectorAll("[data-key]").forEach(function(b){b.onclick=function(){
    var k=b.dataset.key;
    if(k==="clear"){entered=entered.slice(0,-1);draw();return;}
    if(k==="ok"){
      if(hashPin(entered)===state.settings.pinHash){state.settings.lastActive=Date.now();save();d.remove();}
      else{entered="";draw();alert("Incorrect PIN.");}
      return;
    }
    if(entered.length<6){entered+=k;draw();}
  };});
  draw();
}
function seedDemo(){
  var demoId="demo-person";
  state.people=state.people.filter(function(p){return p.id!==demoId;});
  state.people.push({id:demoId,name:"Demo Person",baseline:"Usually calm with predictable routine.",communication:"Short clear phrases; allow processing time.",riskNotes:"Fictional demo profile only."});
  state.active=demoId;
  var now=Date.now(), mk=function(h,l,b,t){var d=new Date(now-h*3600000);return {id:"d"+h+Math.random(),person:demoId,staff:"DM",ts:d.toISOString(),date:d.toISOString().slice(0,10),type:l>=3?"Incident":"Observation",level:l,behaviours:[b],triggers:[t],antecedent:"Fictional demo entry",consequence:"Fictional demo outcome",pain:"0",sleep:"Good",interventions:["Reassurance"],outcome:l>=2?"Somewhat calmer":"No change",injury:"No",damage:"No",restrictive:"No",duration:"5",notes:"Demo data — not a real person."};};
  state.logs=state.logs.filter(function(x){return x.person!==demoId;}).concat([
    mk(30,1,"Repetitive questioning","Waiting/transition"),
    mk(26,2,"Pacing","Routine change"),
    mk(22,3,"Raised voice","Noise/overstimulation"),
    mk(18,1,"Repetitive questioning","Waiting/transition"),
    mk(10,2,"Pacing","Fatigue"),
    mk(5,0,"Other","Unknown")
  ]);
  state.meds=state.meds.filter(function(x){return x.person!==demoId;}).concat([{id:"dm1",person:demoId,name:"Demo medication",dose:"Demo dose",schedule:"08:00",kind:"Regular"}]);
  state.medLogs=state.medLogs.filter(function(x){return x.person!==demoId;}).concat([{id:"dml1",person:demoId,staff:"DM",medId:"dm1",name:"Demo medication",dose:"Demo dose",type:"Regular",ts:new Date(now-24*3600000).toISOString(),date:new Date(now-24*3600000).toISOString().slice(0,10)}]);
  state.settings.demoMode=true;audit("ENABLE_DEMO","Fictional demonstration dataset loaded",demoId);save();render();
}
function clearDemo(){
  var demoId="demo-person";
  ["logs","meds","medLogs","handovers","audit"].forEach(function(k){state[k]=(state[k]||[]).filter(function(x){return x.person!==demoId;});});
  state.people=state.people.filter(function(p){return p.id!==demoId;});
  if(!state.people.length)state.people=[{id:"p1",name:"Person 1",baseline:"",communication:"",riskNotes:""}];
  state.active=state.people[0].id;state.settings.demoMode=false;save();render();
}

function staff(){var u=currentUser();return u?u.initials:(state.settings&&state.settings.staffInitials||"").trim();}
function audit(action,detail,person){
  state.audit=state.audit||[];
  state.audit.push({id:"a"+Date.now()+Math.random(),ts:new Date().toISOString(),person:person||state.active,staff:staff()||"Not set",action:action,detail:detail||""});
  if(state.audit.length>1000)state.audit=state.audit.slice(-1000);

function staffBar(){
  return '<div class="staffbar"><span class="personBadge">Staff</span><input class="inp" id="staffInitials" maxlength="12" placeholder="Initials / ID" value="'+esc(staff())+'"><button class="mini" id="saveStaff">Save</button></div>';

function reportRows(days){
  var logs=mine().filter(function(x){return withinDays(x.ts,days);});
  var meds=medsMine().filter(function(x){return withinDays(x.ts,days);});
  var hs=state.handovers.filter(function(x){return x.person===state.active&&withinDays(x.ts,days);});
  return {logs:logs,meds:meds,hs:hs,severe:logs.filter(function(x){return Number(x.level)>=3;}),incidents:logs.filter(function(x){return x.type==="Incident";})};
}
function reportText(days){
  var r=reportRows(days), ins=insights(days);
  var t=[];
  t.push("NeuroPattern "+days+"-day summary for "+active().name);
  t.push("Behaviour/mood records: "+r.logs.length);
  t.push("Incidents: "+r.incidents.length);
  t.push("High-intensity records: "+r.severe.length);
  t.push("Medication administrations: "+r.meds.length);
  if(ins.length)t.push("Recorded patterns: "+ins.join(" "));
  t.push("Important: these are recorded associations only and do not establish medication causation or provide treatment advice.");
  return t.join("\n");
}
function exportReportTxt(){
  download("NeuroPattern_"+active().name.replace(/\W+/g,"_")+"_"+reportDays+"day_report.txt",reportText(reportDays),"text/plain");
  audit("EXPORT_REPORT",reportDays+"-day text report");save();
}
function pendingPrn(){
  var prns=medsMine().filter(function(x){return x.type==="PRN";}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
  return prns.find(function(p){
    var pt=new Date(p.ts).getTime();
    return !mine().some(function(x){var d=new Date(x.ts).getTime()-pt;return d>=30*60000&&d<=4*3600000&&x.prnFollowFor===p.id;});
  })||null;
}

function v8Header(){
  var u=currentUser();
  return '<div class="v8top"><span class="personBadge">👤 '+esc(active().name)+'</span><span class="personBadge">✍ '+esc(u?u.name:(staff()||"Staff not set"))+(u?' • '+esc(u.role):'')+'</span><button class="iconbtn" id="darkToggle" aria-label="Toggle dark mode">'+(state.settings.dark?'☀️':'🌙')+'</button></div>'+
  (u?'<div class="sessionBar"><span class="muted">Signed in as <b>'+esc(u.initials)+'</b></span><button class="tinyBtn" id="switchUserBtn">Switch user</button><button class="tinyBtn" id="logoutUserBtn">Log out</button></div>':'');
}

function render(){document.body.classList.toggle("dark",!!(state.settings&&state.settings.dark));document.body.classList.toggle("motionOff",!!(state.settings&&state.settings.reducedMotion));
  try{
    renderTabs();
    var views={home:homeView,log:logView,timeline:timelineView,patterns:patternsView,meds:medsView,people:peopleView,reports:reportsView,settings:settingsView};
    document.getElementById("app").innerHTML='<div class="page">'+views[current]()+'</div>';
    bind();
    if(current==="log"&&draftLevel!==null){var ls=document.getElementById("levelSelect");if(ls){ls.value=String(draftLevel);}draftLevel=null;}if(current==="log"&&editingId){editFormSelections(state.logs.find(function(x){return x.id===editingId;}));}
  }catch(err){
    console.error(err);
    document.getElementById("tabs").innerHTML="";
    document.getElementById("app").innerHTML='<div class="page"><h1 class="h1">NeuroPattern</h1>'+card('<b>Dashboard recovery</b><div class="p">A local data error prevented the dashboard from loading. You can reset NeuroPattern local data and reopen the app.</div><button class="btn dangerBtn" id="resetBtn">Reset local app data</button>','danger')+'</div>';
    var r=document.getElementById("resetBtn");if(r)r.onclick=resetData;
  }
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){current=b.dataset.go;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-range]"),function(b){b.onclick=function(){patternDays=Number(b.dataset.range);render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-level]"),function(b){b.onclick=function(){quickSaveLevel(Number(b.dataset.level));};});

  var dt=document.getElementById("darkToggle");if(dt)dt.onclick=toggleDark;

  var sw=document.getElementById("switchUserBtn");if(sw)sw.onclick=showLogin;
  var lo=document.getElementById("logoutUserBtn");if(lo)lo.onclick=logoutUser;
  var asf=document.getElementById("addStaffForm");if(asf)asf.onsubmit=function(e){e.preventDefault();var fd=new FormData(asf);if(createStaffUser(fd.get("name"),fd.get("initials"),fd.get("pin"),fd.get("role"))){audit("CREATE_USER",fd.get("name")+" • "+fd.get("role"));save();render();}else alert("Enter a name, initials and a 4–6 digit PIN.");};
  Array.prototype.forEach.call(document.querySelectorAll("[data-toggle-user]"),function(b){b.onclick=function(){var u=state.users.find(function(x){return x.id===b.dataset.toggleUser;});if(!u)return;u.active=u.active===false?true:false;audit("USER_STATUS",u.name+" • "+(u.active?"enabled":"disabled"));save();render();};});
  var mt=document.getElementById("motionToggle");if(mt)mt.onclick=function(){state.settings.reducedMotion=!state.settings.reducedMotion;save();document.body.classList.toggle("motionOff",state.settings.reducedMotion);render();};

  Array.prototype.forEach.call(document.querySelectorAll("[data-delete-kind]"),function(b){b.onclick=function(){if(confirm("Delete this entry?"))removeRecord(b.dataset.deleteKind,b.dataset.deleteId);};});

  Array.prototype.forEach.call(document.querySelectorAll("[data-edit-log]"),function(b){b.onclick=function(){
    var rec=state.logs.find(function(x){return x.id===b.dataset.editLog;});
    if(!rec)return;
    editingId=rec.id;
    state.active=rec.person;
    current="log";
    render();
  };});


  Array.prototype.forEach.call(document.querySelectorAll("[data-quick]"),function(b){b.onclick=function(){draftLevel=Number(b.dataset.quick);current="log";render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".chips .chip"),function(b){b.onclick=function(){b.classList.toggle("on");};});
  Array.prototype.forEach.call(document.querySelectorAll(".selectPerson"),function(b){b.onclick=function(){state.active=b.dataset.id;save();render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".give"),function(b){b.onclick=function(){var m=state.meds.find(function(x){return x.id===b.dataset.id;}),d=new Date();if(!m)return;var ml={id:String(Date.now()),person:state.active,staff:staff()||"Not set",medId:m.id,name:m.name,dose:m.dose,type:b.dataset.type,ts:d.toISOString(),date:d.toISOString().slice(0,10)};state.medLogs.push(ml);audit("MEDICATION_ADMIN",m.name+" • "+b.dataset.type,ml.person);save();render();};});
  var f=document.getElementById("logForm");if(f)f.onsubmit=function(e){e.preventDefault();var fd=new FormData(f),d=new Date(),existing=editingId?state.logs.find(function(x){return x.id===editingId;}):null;var rec={id:existing?existing.id:String(Date.now()),person:state.active,staff:staff()||"Not set",ts:existing?existing.ts:d.toISOString(),updatedTs:existing?d.toISOString():"",date:(existing?existing.ts:d.toISOString()).slice(0,10),type:fd.get("type"),level:Number(fd.get("level")),behaviours:selected("behaviours"),triggers:selected("triggers"),antecedent:fd.get("antecedent"),consequence:fd.get("consequence"),pain:Number(fd.get("pain")||0),sleep:fd.get("sleep"),interventions:selected("interventions"),outcome:fd.get("outcome"),injury:fd.get("injury")==="on",damage:fd.get("damage")==="on",restrictive:fd.get("restrictive")==="on",duration:Number(fd.get("duration")||0),notes:fd.get("notes"),prnFollowFor:f.dataset.prnFollowFor||"",quick:existing?!!existing.quick:false};if(existing){var ix=state.logs.findIndex(function(x){return x.id===existing.id;});state.logs[ix]=rec;audit("EDIT_BEHAVIOUR",rec.type+" • "+levelName(rec.level),rec.person);}else{state.logs.push(rec);audit("SAVE_BEHAVIOUR",rec.type+" • "+levelName(rec.level),rec.person);}editingId=null;save();current="timeline";render();};
  var mf=document.getElementById("medForm");if(mf)mf.onsubmit=function(e){e.preventDefault();var fd=new FormData(mf);var med={id:String(Date.now()),person:state.active,name:fd.get("name"),dose:fd.get("dose"),schedule:fd.get("schedule"),kind:fd.get("kind")};state.meds.push(med);audit("ADD_MEDICATION",med.name);save();render();};
  var pf=document.getElementById("personForm");if(pf)pf.onsubmit=function(e){e.preventDefault();var fd=new FormData(pf),id="p"+Date.now();state.people.push({id:id,name:fd.get("name"),baseline:fd.get("baseline"),communication:fd.get("communication"),riskNotes:fd.get("riskNotes")});state.active=id;audit("ADD_PROFILE",fd.get("name"),id);save();render();};
  var hf=document.getElementById("handoverForm");if(hf)hf.onsubmit=function(e){e.preventDefault();var fd=new FormData(hf);var h={id:String(Date.now()),person:state.active,staff:staff()||"Not set",ts:new Date().toISOString(),note:fd.get("note")};state.handovers.push(h);audit("SAVE_HANDOVER","Shift handover",h.person);save();render();};

  var ss=document.getElementById("saveStaff"),si=document.getElementById("staffInitials");if(ss&&si)ss.onclick=function(){setStaffInitials(si.value);};

  var pinBtn=document.getElementById("pinBtn");if(pinBtn)pinBtn.onclick=function(){var p=prompt("Choose a 4–6 digit PIN");if(p&&setPin(p)){alert("PIN enabled.");render();}};
  var lockSel=document.getElementById("lockMinutes");if(lockSel){lockSel.value=String(state.settings.autoLockMinutes||5);lockSel.onchange=function(){state.settings.autoLockMinutes=Number(lockSel.value);save();};}
  var lnb=document.getElementById("lockNowBtn");if(lnb)lnb.onclick=lockNow;
  var dpb=document.getElementById("disablePinBtn");if(dpb)dpb.onclick=function(){if(confirm("Disable the app PIN?"))disablePin();};
  var demo=document.getElementById("demoBtn");if(demo)demo.onclick=function(){state.settings.demoMode?clearDemo():seedDemo();};
  var delall=document.getElementById("deleteAllBtn");if(delall)delall.onclick=deleteAllLocalData;

  Array.prototype.forEach.call(document.querySelectorAll("[data-report-days]"),function(b){b.onclick=function(){reportDays=Number(b.dataset.reportDays);state.settings.reportDays=reportDays;save();render();};});
  var rt=document.getElementById("reportTxtBtn");if(rt)rt.onclick=exportReportTxt;
  var pfbtn=document.getElementById("prnFollowBtn");if(pfbtn)pfbtn.onclick=function(){draftLevel=null;current="log";render();var lf=document.getElementById("logForm");if(lf)lf.dataset.prnFollowFor=pfbtn.dataset.prn;};

  var jb=document.getElementById("jsonBtn");if(jb)jb.onclick=exportJSON;
  var cb=document.getElementById("csvBtn");if(cb)cb.onclick=exportCSV;
  var ib=document.getElementById("importBtn"), fi=document.getElementById("importFile");if(ib&&fi){ib.onclick=function(){fi.click();};fi.onchange=importJSON;}
}
function download(name,text,type){var blob=new Blob([text],{type:type}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);}
function exportJSON(){audit("EXPORT_BACKUP","Full JSON backup");save();download("NeuroPattern-backup.json",JSON.stringify(state,null,2),"application/json");}
function exportCSV(){audit("EXPORT_CSV","Behaviour CSV");save();
  var rows=[["timestamp","type","level","behaviours","possible_factors","antecedent","consequence","pain","sleep","interventions","outcome","injury","property_damage","restrictive_intervention","duration_minutes","notes"]];
  mine().forEach(function(x){rows.push([x.ts,x.type,x.level,(x.behaviours||[]).join("; "),(x.triggers||[]).join("; "),x.antecedent,x.consequence,x.pain,x.sleep,(x.interventions||[]).join("; "),x.outcome,x.injury,x.damage,x.restrictive,x.duration,x.notes]);});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download("NeuroPattern-behaviour.csv",csv,"text/csv");
}
function importJSON(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(!d||!Array.isArray(d.people))throw new Error("Invalid");state=d;save();alert("Backup imported.");current="home";render();}catch(err){alert("That file is not a valid NeuroPattern backup.");}};reader.readAsText(file);
}
function resetData(){try{[KEY].concat(OLD_KEYS).forEach(function(k){localStorage.removeItem(k);});}catch(e){}location.reload();}
document.getElementById("quickAdd").onclick=function(){editingId=null;draftLevel=null;current="log";render();};
render();
(function(){
  var sp=document.getElementById("v11Splash");
  if(state.settings.reducedMotion){if(sp)sp.remove();}
  else if(sp){setTimeout(function(){sp.classList.add("out");setTimeout(function(){if(sp.parentNode)sp.remove();},380);},1500);}
  setTimeout(function(){if(!state.sessionUserId||!currentUser())showLogin();},state.settings.reducedMotion?50:1550);
})();
})();
</script>
</body>
