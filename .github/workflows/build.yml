name: Build NeuroPattern Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > neuropattern-release.jks

      - name: Build release APK and AAB
        run: |
          gradle assembleRelease bundleRelease

      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          NeuroPattern.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
          --ks neuropattern-release.jks \
          --ks-pass env:KEYSTORE_PASSWORD \
          --key-pass env:KEY_PASSWORD \
          --ks-key-alias "$KEYSTORE_ALIAS" \
          NeuroPattern.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
          --verbose NeuroPattern.apk

      - name: Sign Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab NeuroPattern.aab

          jarsigner \
          -keystore neuropattern-release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          NeuroPattern.aab \
          "$KEYSTORE_ALIAS"

      - name: Verify Android App Bundle
        run: |
          jarsigner -verify -verbose -certs NeuroPattern.aab

      - name: Upload NeuroPattern APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPattern-APK
          path: NeuroPattern.apk

      - name: Upload NeuroPattern AAB
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPattern-AAB
          path: NeuroPattern.aab          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > neuropattern-release.jks

      - name: Build release APK
        run: gradle assembleRelease

      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          NeuroPattern.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
          --ks neuropattern-release.jks \
          --ks-pass env:KEYSTORE_PASSWORD \
          --key-pass env:KEY_PASSWORD \
          --ks-key-alias "$KEYSTORE_ALIAS" \
          NeuroPattern.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose NeuroPattern.apk

      - name: Upload NeuroPattern APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPattern-APK
          path: NeuroPattern.apk
